<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232650D6'/%3E%3Crect x='6' y='7' width='3' height='19' fill='%23fff'/%3E%3Crect x='23' y='7' width='3' height='19' fill='%23fff'/%3E%3Crect x='4' y='12' width='24' height='3' fill='%23fff'/%3E%3C/svg%3E">
<title>Asticella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#EBEEF3; --ink:#131821; --muted:#5B6476; --faint:#8C95A5; --line:#DDE2EA;
  --accent:#2650D6; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --ok:#14825A; --ok-soft:#DCF1E7; --warn:#AD6F08; --warn-soft:#FAEED4; --bad:#BF3737; --bad-soft:#F7E0E0;
  --shadow:0 1px 2px rgba(19,24,33,.06),0 10px 30px rgba(19,24,33,.10);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  --blk0:#2650D6;--blk1:#8A3FD1;--blk2:#0E7C86;--blk3:#C2570C;--blk4:#C0266D;--blk5:#4D7A12;--blk6:#5B6476;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C0F14; --surface:#151920; --surface2:#1C2129; --ink:#E6E9EF; --muted:#9AA3B3; --faint:#6D7686; --line:#272D37;
    --accent:#7D97FF; --accent-ink:#0C0F14; --accent-soft:#1C2444;
    --ok:#3DC88B; --ok-soft:#11281E; --warn:#E6AA3C; --warn-soft:#2D2311; --bad:#F06C6C; --bad-soft:#321717;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
    --blk0:#7D97FF;--blk1:#C08BFF;--blk2:#3CC3CE;--blk3:#F29A55;--blk4:#F27AAE;--blk5:#9CCB5A;--blk6:#9AA3B3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0F14; --surface:#151920; --surface2:#1C2129; --ink:#E6E9EF; --muted:#9AA3B3; --faint:#6D7686; --line:#272D37;
  --accent:#7D97FF; --accent-ink:#0C0F14; --accent-soft:#1C2444;
  --ok:#3DC88B; --ok-soft:#11281E; --warn:#E6AA3C; --warn-soft:#2D2311; --bad:#F06C6C; --bad-soft:#321717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  --blk0:#7D97FF;--blk1:#C08BFF;--blk2:#3CC3CE;--blk3:#F29A55;--blk4:#F27AAE;--blk5:#9CCB5A;--blk6:#9AA3B3;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior-y:none}
#ptr{white-space:nowrap;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translate(-50%,-70px);z-index:95;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;pointer-events:none;transition:transform .18s}
#ptr.ready{color:var(--accent)}
#ptr svg{width:16px;height:16px}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.nav.mob{display:none}
.acct{font-size:12px;color:var(--faint);margin-top:2px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,table{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.icon{padding:5px 8px}
.btn[disabled]{opacity:.5;cursor:default}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:60px}
.field{display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

/* demo bar */
.demobar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--accent-soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.demobar b{font-family:var(--display);font-size:15px;letter-spacing:.04em;color:var(--accent)}
.demobar select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}

/* coach shell */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;padding:16px;min-height:calc(100% - 44px)}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand svg{flex:none}
.brand span{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;text-align:left;font-weight:500;color:var(--muted)}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.nav svg{width:17px;height:17px;flex:none}
.side .who{margin-top:24px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
main{min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead .sub{color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.weeknav{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.weeknav .btn{border:0;padding:5px 9px}
.weeknav .wl{padding:0 8px;font-weight:600;min-width:140px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* overview */
table.ov{border-collapse:separate;border-spacing:0;width:100%;min-width:960px}
.ov th,.ov td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.ov thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
.ov thead th.today{color:var(--accent)}
.ov td.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.ov tbody tr:last-child td{border-bottom:0}
.ov .ath{min-width:160px}
.ov .ath button{border:0;background:none;padding:0;font-weight:600;text-align:left}
.ov .ath button:hover{color:var(--accent)}
.ov .ath small{display:block;color:var(--faint);font-size:11px}
.ov td.day{min-width:96px;position:relative}
.ov td.day .add{opacity:0;position:absolute;right:4px;bottom:4px}
.ov td.day:hover .add{opacity:1}
.chip{display:flex;align-items:center;gap:6px;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:4px 7px;font-size:12px;font-weight:600;text-align:left;margin-bottom:4px;line-height:1.25}
.chip:hover{border-color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.st-done .dot,.dot.st-done{background:var(--ok)}
.st-progress .dot,.dot.st-progress{background:var(--warn)}
.st-skipped .dot,.dot.st-skipped,.st-missed .dot,.dot.st-missed{background:var(--bad)}
.st-todo .dot,.dot.st-todo{background:transparent;border:1.5px solid var(--faint)}
.chip.st-done{background:var(--ok-soft);border-color:transparent}
.chip.st-missed{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.st-skipped{background:var(--bad-soft);border-color:transparent}
.chip.st-progress{background:var(--warn-soft);border-color:transparent}
.stat{font-family:var(--display);font-size:20px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* calendar */
.cal{display:grid;grid-template-columns:64px repeat(7,minmax(136px,1fr));min-width:1020px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .rail{grid-column:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px;gap:8px;background:var(--surface2)}
.cal .rail .wk{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
.cal .rail .wk small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:500;margin-top:6px}
.cal .rail.cur{background:var(--accent-soft)}
.cal .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:150px;display:flex;flex-direction:column;gap:6px;position:relative}
.cal .cell.sun{border-right:0}
.stb{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 3px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.stb.t-R{background:var(--surface2);color:var(--muted)}
.stb.t-W{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stb.t-B{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stb.t-D{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tbtn{border:1px dashed var(--line);background:transparent;border-radius:6px;width:30px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px}
.tbtn:hover{border-color:var(--accent)}
.tbtn.has{border-style:solid;border-color:transparent}
.lt td.n .stb{margin-top:2px}
.lt td.n{line-height:1.1}
.tlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.tlegend span{display:inline-flex;gap:4px;align-items:center}
/* mesocicli */
.mband{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--mc) 14%,var(--surface));border-left:4px solid var(--mc);cursor:pointer;text-align:left;border-top:0;border-right:0;font:inherit;color:inherit}
.mband:hover{background:color-mix(in srgb,var(--mc) 22%,var(--surface))}
.mband b{font-family:var(--display);font-size:17px;font-weight:700;color:var(--mc);letter-spacing:.02em}
.mband .g{font-weight:600}
.mband .r{color:var(--muted);font-size:12px}
.mband .e{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.cal .rail.inm{box-shadow:inset 4px 0 0 var(--mc);background:color-mix(in srgb,var(--mc) 10%,var(--surface2))}
.cal .rail .mw{font-size:11px;font-weight:700;color:var(--mc);writing-mode:horizontal-tb}
.swatches{display:flex;gap:8px}
.swatches label{width:28px;height:28px;border-radius:50%;background:var(--c);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border:2px solid transparent}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.mesochip{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:8px;background:color-mix(in srgb,var(--mc) 14%,var(--surface));border-left:3px solid var(--mc);font-size:13px}
.mesochip b{color:var(--mc);white-space:nowrap;margin-right:8px}
.cal .cell.drop{background:var(--accent-soft)}
.cal .cell.past{background:color-mix(in srgb,var(--surface2) 40%,var(--surface))}
.cal .dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.cal .dh .d{font-variant-numeric:tabular-nums}
.cal .cell.today .dh .d{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px}
.cal .dh .btn{opacity:0;padding:1px 6px}
.cal .cell:hover .dh .btn{opacity:1}
.wcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 8px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.wcard:hover{border-color:var(--accent)}
.wcard .t{display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px;line-height:1.2}
.wcard ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.wcard li{font-size:12px;display:grid;grid-template-columns:minmax(14px,auto) 1fr;column-gap:5px;line-height:1.25}
.wcard li .b{color:var(--bc,var(--accent));font-weight:700;font-size:11px}
.wcard li .s{grid-column:2;color:var(--muted);font-size:11px}
.wcard.st-done{border-left:3px solid var(--ok)}
.wcard.st-progress{border-left:3px solid var(--warn)}
.wcard.st-missed,.wcard.st-skipped{border-left:3px solid var(--bad)}
.wcard .moved{margin-top:3px;font-size:11px;color:var(--muted);font-style:italic}
.wcard .meta{margin-top:5px;font-size:11px;color:var(--ok);font-weight:600}

/* lists */
table.list{width:100%;border-collapse:collapse}
.list th,.list td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.list th{font-size:12px;color:var(--muted);font-weight:600}
.list tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.note{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note code{background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--ink);word-break:break-all}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.tpl:hover{border-color:var(--accent)}
.tpl-main{border:0;background:none;text-align:left;padding:12px 14px 8px;display:flex;flex-direction:column;gap:2px}
.tpl-main .t{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.tpl ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.tpl li{font-size:13px;display:grid;grid-template-columns:minmax(16px,auto) 1fr;column-gap:6px}
.tpl li .b{color:var(--bc,var(--accent));font-weight:700;font-size:12px}
.wcard li,.tpl li{position:relative}
.wcard li.link::after,.tpl li.link::after{content:"";position:absolute;left:8px;top:15px;bottom:-2px;width:1.5px;border-radius:1px;background:color-mix(in srgb,var(--bc) 55%,transparent)}
.tpl li .s{grid-column:2;color:var(--muted);font-size:12px}
.tpl-foot{display:flex;gap:6px;padding:8px 12px 12px;border-top:1px solid var(--line);margin-top:6px}
.colpick{display:flex;flex-wrap:wrap;gap:6px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:340px;overflow-y:auto}
.prow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.prow:last-child{border-bottom:0}
.prow > span:first-child{flex:1}
.prow > span.faint{font-size:11px}
.prow.off{opacity:.55}
.colpick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.colpick button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* modal */
.back{position:fixed;inset:0;background:rgba(8,10,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:900px;display:flex;flex-direction:column;border:1px solid var(--line);max-height:calc(100dvh - 48px)}
.modal.sm{max-width:460px;background:var(--surface)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{flex:1}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;flex:1}
.modal footer{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;background:inherit;border-radius:0 0 14px 14px}
.dirty{font-size:12px;color:var(--warn);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-head .blk{width:46px;text-align:center;font-weight:700;color:var(--bc,var(--accent))}
.ex-head .nm{font-weight:600;font-size:15px}
.cols{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cols .c{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.cols .c button{border:0;background:transparent;color:inherit;padding:0 5px;font-size:14px;line-height:1}
.cols .c button.mv{padding:0 3px;font-size:13px;opacity:.55}
.cols .c button.mv:hover{opacity:1}
.cols .c button[disabled]{visibility:hidden}
.ssg{border:2px solid var(--accent);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--accent-soft)}
.ssg-h{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--accent);padding:0 4px;display:flex;gap:8px;align-items:baseline}
.ssg-h span{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted)}
.sslink{display:flex;justify-content:center;margin:-6px 0}
.sslink .btn{border-style:dashed;color:var(--muted);font-weight:500}
.sslink .btn.on{border-style:solid;color:var(--accent);background:var(--surface)}
.side-in{display:inline-flex;gap:3px}
.side-in button{width:36px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);font-weight:700;font-size:14px;color:var(--muted)}
.side-in button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sets select{width:84px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:var(--surface2)}
.cols select{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:3px 8px;font-size:12px;color:var(--muted)}
table.sets{border-collapse:collapse}
.sets th{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:2px 4px;text-transform:uppercase;letter-spacing:.05em}
.sets td{padding:2px 3px}
.sets td.n{color:var(--faint);font-size:12px;text-align:center;width:24px}
.sets input{width:74px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:var(--surface2)}
.sets input:focus{background:var(--surface);border-color:var(--accent);outline:none}
.sets .ra{white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface2);width:28px;height:28px;font-size:16px;font-weight:600}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.done-box{border-radius:8px;background:var(--ok-soft);padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.done-box.warnb{background:var(--warn-soft)}
.done-box.badb{background:var(--bad-soft)}
.done-box b{font-size:12px}
button.done-box{border:1px solid transparent;text-align:left;width:100%;color:inherit;position:relative;padding-right:90px}
button.done-box:hover{border-color:var(--ok)}
button.done-box.warnb:hover{border-color:var(--warn)} button.done-box.badb:hover{border-color:var(--bad)}
.done-box .fix{position:absolute;right:10px;top:8px;font-weight:600;color:var(--muted)}
button.done-box:hover .fix{color:var(--ink)}
.fixt input{width:70px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 4px;background:var(--surface2)}
.fixt select{border:1px solid var(--line);border-radius:6px;padding:6px 4px;background:var(--surface2)}
.fixt td,.fixt th{padding:3px}
.fixt th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.done-sets{display:flex;flex-wrap:wrap;gap:4px 10px}
.checks{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto}
.checks .grp{display:flex;flex-direction:column;gap:4px}
.checks label{display:flex;gap:8px;align-items:center;padding:3px 0}

/* toast/confirm */
#toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:90;box-shadow:var(--shadow);transition:opacity .2s}
#toast[hidden]{display:none}

/* login */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.card .logo{display:flex;align-items:center;gap:10px}
.card .logo span{font-family:var(--display);font-size:30px;font-weight:700}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:13px}

/* athlete */
.aw{max-width:560px;margin:0 auto;padding:12px 16px calc(140px + env(safe-area-inset-bottom,0px))}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.ahead h1{font-size:26px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.strip button{border:1px solid transparent;background:var(--surface);border-radius:10px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.strip button .dn{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.strip button .dd{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.strip button .dots{display:flex;gap:2px;height:8px;align-items:center}
.strip button.sel{border-color:var(--accent);background:var(--accent-soft)}
.strip button.today .dd{color:var(--accent)}
.alist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.acard .t{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;font-weight:600}
.acard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.aplan{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.api{display:grid;grid-template-columns:32px 1fr;column-gap:10px;align-items:start}
.api .lc{position:relative;align-self:stretch;display:flex;justify-content:center}
.api .lab{position:relative;z-index:1;min-width:32px;height:24px;padding:0 4px;border-radius:7px;background:color-mix(in srgb,var(--bc) 13%,var(--surface));color:var(--bc);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.api.link .lc::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:24px;bottom:-12px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--bc) 50%,transparent)}
.api .nm{font-weight:600;font-size:15px;color:var(--ink);line-height:1.25;padding-top:2px}
.api .sc{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.api .sst{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--bc);vertical-align:2px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.status-pill.st-done{background:var(--ok-soft);color:var(--ok)}
.status-pill.st-progress{background:var(--warn-soft);color:var(--warn)}
.status-pill.st-skipped,.status-pill.st-missed{background:var(--bad-soft);color:var(--bad)}
.wo-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0}
.wo-top .ttl{flex:1;min-width:0}
.wo-top .ttl h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--faint);white-space:nowrap}
.cnote{background:var(--surface);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.aex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.aex .h{display:flex;gap:8px;align-items:baseline}
.aex .h .b{font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px}
.aex.ssbox{border:2px solid var(--accent)}
.aex .sshead{font-family:var(--display);font-weight:700;color:var(--accent);font-size:16px;letter-spacing:.04em}
.aex .sshead span{display:block;font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted)}
.aex .sub{display:flex;flex-direction:column;gap:8px}
.aex .sub + .sub{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.aex .h .n{font-weight:700;font-size:16px;flex:1}
.aex .info{font-size:13px;color:var(--muted);white-space:pre-wrap}
.aex .prev{font-size:12px;color:var(--faint)}
.aex a{color:var(--accent);font-size:13px;font-weight:600}
/* video dentro l'app */
.aex .vbtn{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:600}
#vid .vback{position:fixed;inset:0;z-index:90;background:rgba(10,12,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#vid .vwrap{background:var(--surface);border-radius:14px;overflow:hidden;width:min(900px,100%);display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
#vid .vwrap.tall{width:min(420px,100%)}
#vid .vhead{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
#vid .vhead b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vid .vframe{position:relative;background:#000;aspect-ratio:16/9;max-height:calc(100dvh - 130px)}
#vid .vwrap.tall .vframe{aspect-ratio:9/16}
#vid .vframe iframe,#vid .vframe video{position:absolute;inset:0;width:100%;height:100%;border:0}
#vid .vfoot{padding:8px 14px;font-size:12px;color:var(--muted)}
#vid .vhead .vfs{white-space:nowrap;font-size:12px}
/* Google Drive: non sappiamo se il video è verticale o orizzontale → riquadro alto, il lettore di Drive lo centra da solo */
#vid .vwrap.drv{width:min(560px,100%)}
#vid .vwrap.drv .vframe{aspect-ratio:auto;height:min(72dvh,720px)}
/* telefono: finestra più larga possibile */
@media (max-width:700px){ #vid .vback{padding:8px} #vid .vwrap,#vid .vwrap.tall,#vid .vwrap.drv{width:100%} #vid .vwrap{max-height:calc(100dvh - 16px)} }
/* schermo intero (anche finto, per iPhone) */
#vid .vwrap.full{position:fixed;inset:0;width:100%!important;max-height:none;height:100dvh;border-radius:0}
#vid .vwrap.full .vframe{flex:1;aspect-ratio:auto;height:auto;max-height:none}
#vid .vwrap.full .vfoot{display:none}
#vid .vwrap.full{background:#000} #vid .vwrap.full .vhead{padding:2px 4px 2px 12px;color:#fff} #vid .vwrap.full .vhead .btn{color:#fff}
#vid .vback:fullscreen{padding:0;background:#000}
#vid .vfoot a{color:var(--accent);font-weight:600}
body.noscroll{overflow:hidden}
/* cambio esercizio */
.aex .h .swbtn{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none;align-self:center}
.aex .h .swbtn:hover{color:var(--ink);border-color:var(--faint)}
.swinfo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--warn-soft);border-radius:8px;padding:6px 10px;font-size:12px}
.swinfo span{flex:1;min-width:160px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchips button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.rchips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wcard li .swn{font-style:italic} .wcard li .swn s{color:var(--faint)}
.aplan .sc.swl{color:var(--warn,#b7791f);font-style:italic}
.altrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.altrow .lbl{margin:0}
.altc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.altc.inh{border-style:dashed;background:transparent;color:var(--muted)}
.altc button{border:0;background:none;color:var(--faint);font-size:14px;line-height:1;padding:0 4px}
.altc button:hover{color:var(--bad)}
.in.altin{width:170px;padding:4px 8px;font-size:12px}
.swbox span{color:var(--muted)}
.lt{width:100%;border-collapse:separate;border-spacing:0}
/* tanti parametri: la tabella scorre di lato dentro il riquadro, numero serie e spunta restano fermi */
.ltwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.lt.many{width:max-content;min-width:100%}
.lt.many input,.lt.many .ro{width:64px}
.lt td.n,.lt th:first-child{position:sticky;left:0;z-index:2;background:var(--surface)}
.lt td.ckc,.lt th:last-child{position:sticky;right:0;z-index:2;background:var(--surface)}
.lt.many td.ckc,.lt.many th:last-child{box-shadow:-8px 0 8px -6px rgba(0,0,0,.18);padding-left:6px}
.lt.many td.n,.lt.many th:first-child{box-shadow:8px 0 8px -6px rgba(0,0,0,.18)}
.scrollhint{font-size:11px;color:var(--faint);text-align:right;margin-top:-2px}
.lt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:4px 2px;text-align:center}
.lt td{padding:3px 2px;text-align:center}
.lt td.n{color:var(--faint);font-weight:700;width:22px}
.lt .ro{height:42px;min-width:44px;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:9px;color:var(--muted);font-weight:600;font-size:15px;padding:0 4px;white-space:nowrap}
.lt th.roh{color:var(--faint);font-weight:500}
.ro.mini{display:inline-flex;height:18px;min-width:22px;font-size:11px;border:1.5px dashed var(--line);border-radius:5px;padding:0 3px;color:var(--muted);margin-right:2px}
.rmx{width:26px;height:26px;border-radius:50%;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft);color:var(--bad);font-size:12px;font-weight:700;padding:0;line-height:1}
.lt input{width:100%;min-width:44px;height:42px;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--surface2);font-size:17px;font-weight:600}
.lt input::placeholder{color:var(--faint);font-weight:500}
.lt input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.lt tr.ok input{background:var(--ok-soft);border-color:transparent}
.ck{width:42px;height:42px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.ck svg{width:20px;height:20px;stroke:var(--faint)}
tr.ok .ck{background:var(--ok);border-color:var(--ok)}
tr.ok .ck svg{stroke:#fff}
.addset{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.bottombar .btn{width:100%;max-width:528px;justify-content:center;padding:14px;font-size:16px;border-radius:12px}
.wopts{display:flex;flex-direction:column;gap:8px}
.wopt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;text-align:left;width:100%}
.wopt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none;position:relative}
.wopt span{display:flex;flex-direction:column}
.wopt b{font-size:15px}
.wopt small{font-size:12px;color:var(--muted)}
.wopt.on{border-color:var(--accent);background:var(--accent-soft)}
.wopt.on i{border-color:var(--accent)}
.wopt.on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rpe button b{font-family:var(--display);font-size:22px;line-height:1}
.rpe button small{font-size:10px;color:var(--muted);line-height:1.1;text-align:center}
.rpe button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe button.on small{color:inherit}


/* analisi */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.kpi:hover{border-color:var(--faint)}
.kpi.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.kpi .k-l{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .k-v{font-size:28px;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1.15}
.kpi .k-v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi .k-s b{color:var(--ink);font-weight:600}
.chartcard{padding:16px 16px 12px;margin-bottom:14px}
.chartcard h3{font-family:var(--sans);font-size:15px;font-weight:700}
.chartcard .cdesc{font-size:12px;color:var(--muted);margin-top:2px}
.chartwrap{position:relative;margin-top:10px}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .grid line{stroke:var(--line);stroke-width:1}
.chartwrap .axis text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chartwrap .axis text.cur{fill:var(--ink);font-weight:600}
.chartwrap .bar{fill:var(--accent);transition:opacity .12s}
.chartwrap .bar.part{fill:color-mix(in srgb,var(--accent) 40%,var(--surface))}
.chartwrap .col:hover .bar,.chartwrap .col:focus .bar{opacity:.78}
.chartwrap .col{cursor:default;outline:none}
.chartwrap .col:focus-visible .hit{stroke:var(--accent);stroke-width:1.5}
.chartwrap .hit{fill:transparent}
.chartwrap .vlab{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--sans)}
.ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;min-width:140px;z-index:5}
.ctip .tv{font-size:16px;font-weight:700;color:var(--ink)}
.ctip .tl{color:var(--muted)}
.clegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend i{display:inline-block;width:14px;height:6px;border-radius:2px;background:var(--c)}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-4px 0 14px}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.mchip i{width:8px;height:8px;border-radius:50%;background:var(--mc);opacity:.5}
.mchip span{font-weight:500;color:var(--faint)}
.mchip:hover{border-color:var(--mc)}
.mchip.whole{border-style:solid;border-color:var(--mc);background:color-mix(in srgb,var(--mc) 12%,var(--surface));color:var(--ink)}
.mchip.whole i,.mchip.part i{opacity:1}
.mchip.part{border-style:solid;border-color:color-mix(in srgb,var(--mc) 50%,var(--line));color:var(--ink)}
.antables{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.antables h3{font-family:var(--sans);font-size:15px;font-weight:700;padding:14px 14px 0}
.antables .cdesc{font-size:12px;color:var(--muted);padding:2px 14px 8px}
table.nt{width:100%;border-collapse:collapse;font-size:13px}
.nt th,.nt td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.nt th:first-child,.nt td:first-child{text-align:left;white-space:normal}
.nt th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.nt tr:last-child td{border-bottom:0}
.nt tr.sel td{background:var(--accent-soft)}
.nt button.lk{border:0;background:none;padding:0;font-weight:600;text-align:left}
.nt button.lk:hover{color:var(--accent)}
.meter{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--surface2);vertical-align:middle;margin-left:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:3px}
@media (max-width:860px){.kpis{grid-template-columns:minmax(0,1fr)}.antables{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .brand{padding:4px 8px 4px 0}
  .brand span{display:none}
  .side .who{display:none}
  .nav.mob{display:flex}
  .nav{white-space:nowrap}
  .two{grid-template-columns:1fr}
  .back{padding:0}
  .modal{border-radius:0;height:100dvh;max-height:100dvh}
  .demobar .dtxt{display:none}
  .demobar{padding-block:6px}
  .modal.sm{border-radius:14px;height:auto;max-height:calc(100dvh - 32px);margin:auto 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="confirm"></div>

function FirebaseDB(F, db){
  const W = (e) => F.collection(db, "athletes", e, "workouts");
  const docs = snap => snap.docs.map(d => ({...d.data(), id: d.id}));
  const cleanObj = o => JSON.parse(JSON.stringify(o));
  // Se il server non risponde entro 7 secondi (rete lenta in palestra, telefono appena riattivato)
  // si usano i dati già salvati sul telefono invece di restare bloccati.
  const fast = async (serverCall, cacheCall) => {
    let t; const slow = new Promise((_, rej) => { t = setTimeout(() => rej({code: "slow"}), 7000); });
    try { return await Promise.race([serverCall(), slow]); }
    catch(e) { if (e?.code !== "slow") throw e; S.slow = true; return await cacheCall(); }
    finally { clearTimeout(t); }
  };
  return {
    async listAthletes(){ return docs(await F.getDocs(F.collection(db, "athletes"))); },
    async getAthlete(e){ const r = F.doc(db, "athletes", e); const s = await fast(() => F.getDoc(r), () => F.getDocFromCache(r)); return s.exists() ? s.data() : null; },
    async saveAthlete(a){ await F.setDoc(F.doc(db, "athletes", a.email), cleanObj(a), {merge:true}); return a; },
    async listExercises(){ const q = F.collection(db, "exercises"); return docs(await fast(() => F.getDocs(q), () => F.getDocsFromCache(q))); },
    async saveExercise(x){ await F.setDoc(F.doc(db, "exercises", x.id), cleanObj(x)); return x; },
    async deleteExercise(id){ await F.deleteDoc(F.doc(db, "exercises", id)); },
    async listTemplates(){ return docs(await F.getDocs(F.collection(db, "templates"))); },
    async getSettings(){ const r = F.doc(db, "settings", "app");
      try { const s = await fast(() => F.getDoc(r), () => F.getDocFromCache(r)); return s.exists() ? s.data() : {}; } catch(e) { console.warn(e); return {}; } },
    async saveSettings(x){ await F.setDoc(F.doc(db, "settings", "app"), cleanObj(x), {merge:true}); },
    async saveTemplate(t){ await F.setDoc(F.doc(db, "templates", t.id), cleanObj(t)); return t; },
    async deleteTemplate(id){ await F.deleteDoc(F.doc(db, "templates", id)); },
    async listWorkouts(e, from, to){ const q = F.query(W(e), F.where("date", ">=", from), F.where("date", "<=", to)); return docs(await fast(() => F.getDocs(q), () => F.getDocsFromCache(q))); },
    async createWorkout(e, w){ await F.setDoc(F.doc(W(e), w.id), cleanObj(w)); return w; },
    async saveWorkout(e, w){ const p = {}; COACH_FIELDS.forEach(k => { if (w[k] !== undefined) p[k] = w[k]; });
      await F.setDoc(F.doc(W(e), w.id), cleanObj(p), {merge:true}); },
    async deleteWorkout(e, id){ await F.deleteDoc(F.doc(W(e), id)); },
    async saveResults(e, id, patch){ await F.updateDoc(F.doc(W(e), id), cleanObj(patch)); },
  };
}

function demoHistory(st){
  const ws0 = monday(TODAY()), prevWs = addDays(ws0, -7);
  Object.values(st.athletes).forEach((a, ai) => {
    const base = Object.values(st.workouts[a.email] || {}).filter(w => w.date >= prevWs && w.date < ws0);
    for (let k = 1; k <= 10; k++) base.forEach((w, wi) => {
      const date = addDays(w.date, -7*k); const seed = (k*7 + wi*3 + ai*5);
      const nw = clone(w); nw.id = uid() + k + wi + ai; nw.date = date; nw.results = {}; nw.coachEditedAt = undefined;
      const deload = k === 5;                                   // una settimana di scarico
      nw.exercises.forEach(x => { x.id = uid() + x.name.length + k;
        x.sets.forEach(s => { if (s.kg) s.kg = String(Math.max(10, Math.round((+s.kg - 2.5*k + (deload ? -10 : 0)) * 2) / 2)); });
        const nSets = deload ? Math.max(2, x.sets.length - 1) : x.sets.length;
        nw.results[x.id] = x.sets.slice(0, nSets).map((s, i) => { const r = {done:true};
          x.cols.filter(c => COLS[c].log).forEach(c => { let v = s[c] || "";
            if (c === "height") v = String((+v || 40) - Math.round(k/2) + ((i + seed) % 5) - 2);
            if (c === "time") v = x.name.includes("20") ? (3.02 + ((i+seed)%5)*0.03 + k*0.01).toFixed(2) : x.name.includes("10") ? (1.78 + ((i+seed)%4)*0.02).toFixed(2) : "40";
            if (c === "vel") v = (1.30 + (i%3)*0.04).toFixed(2);
            if (c === "rpe") v = String(Math.min(10, (+v || 7) - (deload ? 2 : 0) + ((i+seed)%2)));
            r[c] = v; }); return r; }); });
      const skip = (seed % 13) === 0;
      nw.status = skip ? "skipped" : "done"; nw.completedAt = date;
      nw.sessionRpe = skip ? null : Math.max(3, (deload ? 4 : 6) + (seed % 3) + (k < 4 ? 1 : 0));
      nw.durationMin = skip ? null : (deload ? 45 : 55) + (seed * 7) % 30;
      nw.athleteNote = skip ? "Assente" : "";
      delete nw.coachEditedAt;
      st.workouts[a.email][nw.id] = nw; });
  });
}

async function ensureWeeks(email, ws, n, force=false){
  const set = (S.loaded[email] ??= new Set());
  const cache = (S.cache[email] ??= {});
  const need = [];
  for (let i=0;i<n;i++){ const w = addDays(ws, i*7); if (force || !set.has(w)) need.push(w); }
  if (!need.length) return;
  const from = need[0], to = addDays(need[need.length-1], 6);
  const slowBefore = S.slow; S.slow = false;
  const list = await DB.listWorkouts(email, from, to);
  const wasSlow = S.slow; S.slow = slowBefore || wasSlow;
  if (wasSlow && !list.length) return;          // rete lenta e niente in memoria: tengo quello che si vede già e riprovo la prossima volta
  Object.values(cache).forEach(w => { if (w.date >= from && w.date <= to) delete cache[w.id]; });
  list.forEach(w => cache[w.id] = w);
  if (!wasSlow) need.forEach(w => set.add(w));
}
const effDate = w => w.doneDate || w.date;     // giorno in cui è stato svolto davvero (se diverso da quello previsto)
const wOn = (email, date) => Object.values(S.cache[email] || {}).filter(w => effDate(w) === date).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"") || (a.title||"").localeCompare(b.title||""));
const wIn = (email, from, to) => Object.values(S.cache[email] || {}).filter(w => effDate(w) >= from && effDate(w) <= to);
const activeAthletes = () => S.athletes.filter(a => !a.archived).sort((a,b)=>a.name.localeCompare(b.name));
const groups = () => [...new Set(S.athletes.map(a => a.group).filter(Boolean))].sort();
const athByEmail = e => S.athletes.find(a => a.email === e);
const libByName = n => S.exercises.find(x => x.name.trim().toLowerCase() === String(n||"").trim().toLowerCase());
/* ---------- cambio esercizio da parte dell'atleta ----------
   w.swaps = {idEsercizio: {name, reason, note, at}} → il programma del coach resta intatto, si registra solo cosa è stato fatto davvero */
const SWAP_REASONS = {busy:"Attrezzo occupato", missing:"Attrezzo mancante", pain:"Fastidio / dolore", other:"Altro"};
const exName = (w, x) => w?.swaps?.[x.id]?.name || x.name;
const swapOf = (w, x) => w?.swaps?.[x.id] || null;
const swapWhy = sw => sw ? [SWAP_REASONS[sw.reason] || "", sw.note || ""].filter(Boolean).join(": ") : "";
const sameName = (a, b) => String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();
/* alternative: quelle scritte nell'allenamento (se il coach le ha cambiate lì), altrimenti quelle della libreria */
const altsOf = x => Array.isArray(x.alts) ? x.alts : (libByName(x.name)?.alts || []);
function swapOptions(x){
  const own = altsOf(x).filter(n => n && !sameName(n, x.name));
  /* prima le alternative del coach, poi (come riserva) gli esercizi con lo stesso pattern motorio */
  const lib = libByName(x.name);
  const same = !lib?.pattern ? [] : S.exercises.filter(e => e.id !== lib.id && e.pattern === lib.pattern && !own.some(n => sameName(n, e.name)))
    .sort((a,b) => (b.category === lib.category) - (a.category === lib.category) || a.name.localeCompare(b.name, "it")).slice(0, 8).map(e => e.name);
  const list = [...own, ...same];
  return {kind: list.length ? (own.length ? "coach" : "pattern") : "none", pattern: lib?.pattern || "", nCoach: own.length, list};
}

function statusOf(w){
  const s = w.status || "todo";
  if (s === "todo" && w.date < TODAY()) return "missed";
  return s;
}
const STATUS_TXT = {todo:"Da fare", progress:"In corso", done:"Completato", skipped:"Non svolto", missed:"Non registrato"};

function fmtVal(c, v){ if (v === undefined || v === "") return ""; const u = COLS[c]?.u; if (!u) return c === "reps" ? `${v} rep` : `${COLS[c].l} ${v}`; return /^[\d.,]+$/.test(v) ? `${v}${u==="%"?"%":" "+u}` : v; }
function summarize(x){
  const sets = x.sets || []; if (!sets.length) return "";
  const cols = x.cols || [];
  const same = c => sets.every(s => (s[c]||"") === (sets[0][c]||""));
  const vals = c => same(c) ? (sets[0][c]||"") : sets.map(s => s[c]||"–").join("/");
  const out = [cols.includes("reps") && vals("reps") ? `${sets.length}×${vals("reps")}` : `${sets.length}×`];
  cols.filter(c => c !== "reps" && c !== "rest").forEach(c => { const v = vals(c); if (!v.replace(/[–/]/g,"")) return;
    const u = COLS[c].u; out.push(u ? (u === "%" ? `${v}%` : `${v} ${u}`) : `${COLS[c].l} ${v}`); });
  return out.join(" · ");
}
const unitTag = c => { const u = COLS[c].u; return u && u !== "%" && u.toLowerCase() !== COLS[c].l.toLowerCase() ? ` <span class="faint" style="text-transform:none">${u}</span>` : ""; };
/* superserie: un esercizio con ss=true è unito a quello precedente */
function ssGroups(exs){ const g = []; (exs||[]).forEach((x,i) => { if (x.ss && i > 0) g[g.length-1].push(i); else g.push([i]); }); return g; }
function exLabels(exs){ const out = []; ssGroups(exs).forEach(g => { const b = exs[g[0]].block || ""; g.forEach((i,k) => out[i] = g.length > 1 ? b + (k+1) : (exs[i].block || "")); }); return out; }
const SIDES = ["", "Dx", "Sx", "Dx+Sx"];
/* tipo di serie: lo decide solo il coach (campo "type" nella serie programmata) */
const SET_TYPES = {R:{l:"Ramping set", s:"Ramp"}, W:{l:"Work set", s:"Work"}, B:{l:"Back-off set", s:"Back-off"}, D:{l:"Down set", s:"Down"}};
const TYPE_ORDER = ["", "R", "W", "B", "D"];
const typeBadge = (t, extra="") => t && SET_TYPES[t] ? `<span class="stb t-${t}" title="${SET_TYPES[t].l}" ${extra}>${t}</span>` : "";
/* una serie registrata è "vuota" se non ha valori e non è spuntata */
const emptyRes = r => !r || (!r.done && !Object.entries(r).some(([k,v]) => k !== "done" && String(v ?? "").trim() !== ""));
/* toglie le serie extra (oltre quelle programmate) rimaste vuote */
function pruneExtra(w){ (w.exercises||[]).forEach(x => { const r = w.results?.[x.id]; if (!r) return;
  while (r.length > x.sets.length && emptyRes(r[r.length-1])) r.pop(); }); }
/* mesocicli: salvati nella scheda dell'atleta, campo mesos = [{id, name, goal, from (lunedì), weeks, color}] */
const MESO_COLORS = ["#2650D6","#14825A","#B7770B","#BF3737","#7A3FC4","#0E7C86"];
function mesoAt(a, date){
  const ms = (a?.mesos || []).slice().sort((x,y) => x.from.localeCompare(y.from));
  const ws = monday(date);
  for (const m of ms){ const end = addDays(m.from, 7*m.weeks - 1);
    if (date >= m.from && date <= end) return {...m, idx: Math.floor(daysBetween(m.from, ws)/7) + 1, end}; }
  return null;
}
const BLOCK_COLORS = ["#2650D6","#8A3FD1","#0E7C86","#C2570C","#C0266D","#4D7A12","#5B6476"];
const blockColor = lbl => { const c = String(lbl||"").trim().toUpperCase().charCodeAt(0); return `var(--blk${c >= 65 && c <= 90 ? (c-65) % 6 : 6})`; };
/* schema leggibile per l'atleta: "4 set × 5 reps · 80 kg · RPE 8" */
function schemeText(x){
  const sets = x.sets || []; if (!sets.length) return "";
  const cols = x.cols || [];
  const same = c => sets.every(s => (s[c]||"") === (sets[0][c]||""));
  const vals = c => same(c) ? (sets[0][c]||"") : sets.map(s => s[c]||"–").join("/");
  const n = sets.length;
  const out = [`${n} ${n === 1 ? "set" : "set"}${cols.includes("reps") && vals("reps") ? ` × ${vals("reps")} reps` : ""}`];
  cols.filter(c => c !== "reps" && c !== "rest").forEach(c => { const v = vals(c); if (!v.replace(/[–/]/g,"")) return;
    const u = COLS[c].u; out.push(u ? (u === "%" ? `${v}%` : `${v} ${u}`) : `${COLS[c].l} ${v}`); });
  if (cols.includes("rest")) { const v = vals("rest"); if (v.replace(/[–/]/g,"")) out.push(`rec. ${v}`); }
  return out.join(" · ");
}
function miniListHtml(exs, w){
  exs = exs || []; const L = exLabels(exs);
  const inGroup = []; ssGroups(exs).forEach(g => g.forEach((i,k) => inGroup[i] = {size: g.length, k, lead: g[0]}));
  return `<ol>${exs.map((x,i) => { const g = inGroup[i]; const link = g.size > 1 && g.k < g.size - 1;
    return `<li class="${link ? "link" : ""}" style="--bc:${blockColor(exs[g.lead].block || L[i])}" ${g.size > 1 ? 'title="Superserie"' : ""}><span class="b">${esc(L[i])}</span>${(sw => sw ? `<span class="swn" title="Cambiato dall'atleta: previsto ${esc(x.name)}${swapWhy(sw) ? " · "+esc(swapWhy(sw)) : ""}"><s>${esc(x.name)}</s> ↔ ${esc(sw.name)}</span>` : `<span>${esc(x.name||"—")}</span>`)(swapOf(w, x))}<span class="s">${esc(summarize(x))}</span></li>`; }).join("")}</ol>`;
}
function planListHtml(exs, w){
  exs = exs || []; const L = exLabels(exs);

    return `<li class="api ${link ? "link" : ""}" style="--bc:${col}"><div class="lc"><span class="lab">${esc(L[i] || "•")}</span></div>
      <div><div class="nm">${esc(exName(w, x))}${g.size > 1 && g.k === 0 ? `<span class="sst">superserie</span>` : ""}</div>${swapOf(w, x) ? `<div class="sc swl">↔ al posto di ${esc(x.name)}</div>` : ""}<div class="sc">${esc(schemeText(x))}</div></div></li>`; }).join("")}</ul>`;
}
/* profili "senza accesso" (squadre o atleti che non usano l'app): hanno un codice al posto dell'email,
   con dominio .local, dove non arriva nessuna email di conferma → nessuno può entrare con quel profilo */
const isNoAccess = a => !!a && (a.noAccess || /\.local$/.test(a.email || ""));
const noAccessId = name => (String(name).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "profilo") + "-" + Math.random().toString(36).slice(2, 6) + "@senza-accesso.local";
function resultLine(r, cols){ return cols.filter(c => COLS[c].log && r[c]).map(c => fmtVal(c, r[c])).join(" · "); }

async function boot(){
  if (DEMO) {
    DB = LocalDB();
    await loadCoachData();
    setDemoRole(S.demoRole);
    return;
  }
  renderMsg("Caricamento…");
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [App, A, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
    const app = App.initializeApp(FIREBASE_CONFIG);
    const auth = A.getAuth(app);
    let db;
    try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
    catch(e) { db = F.getFirestore(app); }
    FB = {A, F, auth, db};
    DB = FirebaseDB(F, db);
    A.getRedirectResult(auth).catch(e => { S.loginErr = authMsg(e); });
    A.onAuthStateChanged(auth, onUser);
  } catch(e) {
    console.error(e);
    renderMsg("Impossibile caricare l'app. Controlla la connessione e ricarica la pagina.");
  }
}

async function onUser(u){
  if (!u) { S.user = null; return renderLogin(); }
  const email = (u.email || "").toLowerCase();
  if (!u.emailVerified) return renderVerify(u);
  // Chi è il coach lo decidono SOLO le regole di sicurezza di Firebase (l'email del coach non è scritta qui):
  // se l'utente riesce a leggere l'elenco degli atleti è il coach, altrimenti è un atleta.
  renderMsg("Caricamento…");
  try {
    await loadCoachData();
    S.user = {email, name: u.displayName || "Coach", role:"coach"};
    return render();
  } catch(e) {
    if (e?.code !== "permission-denied") { console.error(e); return renderMsg("Errore di connessione nel caricare i dati. Controlla la rete e ricarica la pagina. (" + (e?.code || e) + ")"); }
  }
  try {
    const a = await DB.getAthlete(email);
    if (!a || a.archived) return renderNotRegistered(email);
    S.user = {email, name: a.name, role:"athlete", group: a.group, mesos: a.mesos || []};
    renderMsg("Caricamento programma…");
    const [ex, st] = await Promise.all([DB.listExercises().catch(() => null), DB.getSettings().catch(() => ({})), ensureWeeks(email, addDays(S.ath.ws, -56), 11)]);
    if (ex) S.exercises = ex;
    applyParams(st?.params);
    fillDatalist();
    renderAthlete();
  } catch(e) { console.error(e); renderNotRegistered(email); }
}

async function loadCoachData(){
  let st;
  [S.athletes, S.exercises, S.templates, st] = await Promise.all([DB.listAthletes(), DB.listExercises(), DB.listTemplates(), DB.getSettings()]);
  S.params = st.params || []; applyParams(S.params);
  S.templates.sort((a,b) => (a.title||"").localeCompare(b.title||""));
  S.exercises.sort((a,b)=>a.name.localeCompare(b.name));
  if (!S.calAthlete || !athByEmail(S.calAthlete)) S.calAthlete = activeAthletes()[0]?.email || null;
  fillDatalist();
}

  const days = Array.from({length:7}, (_,i) => addDays(S.ws, i));

    <div class="toolbar">
      <select class="in" id="cal-ath" data-change="cal-ath" style="width:auto">${ath.map(x => `<option value="${esc(x.email)}" ${x.email===a.email?"selected":""}>${esc(x.name)}</option>`).join("")}</select>

  if (S.view !== "calendar") return;
  drawCalendar();

function drawCalendar(){
  const a = athByEmail(S.calAthlete); const today = TODAY(), curWs = monday(today);
  let html = `<div class="cal">`;
  for (let k=0;k<S.calWeeks;k++){
    const ws = addDays(S.ws, k*7);
    const n = wIn(a.email, ws, addDays(ws,6)).length;
    const mz = mesoAt(a, ws);
    if (mz && (mz.idx === 1 || k === 0)) html += `<button class="mband" style="--mc:${mz.color}" data-act="meso-edit" data-id="${mz.id}" title="Clicca per modificare il mesociclo">
      <b>${esc(mz.name)}</b>${mz.goal ? `<span class="g">${esc(mz.goal)}</span>` : ""}<span class="r">${mz.weeks} settimane · ${fmtD(mz.from)} – ${fmtD(mz.end)}</span><span class="e">✎ Modifica</span></button>`;
    html += `<div class="rail ${ws===curWs?"cur":""} ${mz?"inm":""}" ${mz?`style="--mc:${mz.color}"`:""}>${mz ? `<span class="mw" title="${esc(mz.name)}: settimana ${mz.idx} di ${mz.weeks}">${mz.idx}/${mz.weeks}</span>` : ""}<div class="wk">Sett. ${weekNo(ws)}<small>${fmtRange(ws)}</small></div>
      <button class="btn sm" data-act="copy-week" data-ws="${ws}" title="Copia questa settimana" ${n?"":"disabled"}>Copia</button></div>`;
    for (let i=0;i<7;i++){
      const d = addDays(ws, i);
      html += `<div class="cell ${d===today?"today":""} ${d<today?"past":""} ${i===6?"sun":""}" data-drop="${d}">
        <div class="dh"><span class="d">${DAYS[i]} ${parse(d).getDate()}${parse(d).getDate()===1||(k===0&&i===0)?" "+MONTHS[parse(d).getMonth()]:""}</span>
        <button class="btn sm ghost" data-act="new-w" data-e="${esc(a.email)}" data-d="${d}" aria-label="Nuovo allenamento il ${fmtD(d)}">+</button></div>
        ${wOn(a.email, d).map(w => cardHtml(a.email, w)).join("")}</div>`;
    }
  }
  $("#calwrap").innerHTML = html + `</div>`;
}
function cardHtml(email, w){
  const st = statusOf(w);
  return `<div class="wcard st-${st}" draggable="true" data-drag="${w.id}" data-act="open-w" data-e="${esc(email)}" data-id="${w.id}" tabindex="0" title="${STATUS_TXT[st]}">
    <div class="t"><span class="dot st-${st}"></span>${esc(w.title||"Senza titolo")}</div>
    ${miniListHtml(w.exercises, w)}
    ${st==="done" ? `<div class="meta">✓ ${w.sessionRpe?`RPE ${w.sessionRpe}`:""}${w.durationMin?` · ${w.durationMin}′`:""}</div>` : ""}
    ${w.doneDate && w.doneDate !== w.date ? `<div class="moved">↷ previsto ${esc(DAYS[dayIdx(w.date)].toLowerCase())} ${parse(w.date).getDate()}</div>` : ""}</div>`;
}

function mesoDialog(m){
  const a = athByEmail(S.calAthlete); const isNew = !m.id;

  const byG = [...gs, ""].map(g => [g, ath.filter(x => (x.group||"") === g)]).filter(([,l]) => l.length);
  $("#confirm").innerHTML = `<div class="back" style="z-index:70"><form class="modal sm" id="ms-form"><header><h2>${isNew ? "Nuovo mesociclo" : "Mesociclo"}</h2></header><div class="body">

      <datalist id="goal-list">${["Adattamento anatomico","Ipertrofia","Forza massima","Forza esplosiva","Potenza","Conversione","Mantenimento","Scarico","Tapering","Transizione"].map(g=>`<option value="${g}"></option>`).join("")}</datalist></div></div>
    <div class="row"><div class="field grow"><label class="lbl" for="ms-from">Inizia la settimana del</label><input class="in" type="date" id="ms-from" value="${m.from}" required></div>
      <div class="field"><span class="lbl">Durata</span><span class="stepper"><button type="button" id="ms-minus" aria-label="Una settimana in meno">−</button><span class="num" id="ms-w" style="padding:0 8px">${m.weeks} sett.</span><button type="button" id="ms-plus" aria-label="Una settimana in più">+</button></span></div></div>
    <div class="field"><span class="lbl">Colore</span><div class="swatches">${MESO_COLORS.map(c => `<label style="--c:${c}" title="${c}"><input type="radio" name="ms-c" value="${c}" ${m.color===c?"checked":""}></label>`).join("")}</div></div>
    ${isNew ? `<div class="field"><span class="lbl">Per gli atleti</span><div class="checks" style="max-height:200px">${byG.map(([g,l]) => `<div class="grp"><b>${esc(g||"Senza gruppo")}</b>
      ${l.map(x => `<label><input type="checkbox" name="ms-a" value="${esc(x.email)}" ${x.email===a.email?"checked":""}> ${esc(x.name)}</label>`).join("")}</div>`).join("")}</div></div>` : `<div class="faint" style="font-size:12px">Mesociclo di ${esc(a.name)}.</div>`}
    </div><footer>${isNew ? "" : `<button type="button" class="btn ghost danger" id="ms-del">Elimina</button>`}<span class="grow"></span><button type="button" class="btn" id="ms-no">Annulla</button><button class="btn pri">Salva</button></footer></form></div>`;
  let weeks = m.weeks;
  const upd = () => $("#ms-w").textContent = weeks + " sett.";
  $("#ms-minus").onclick = () => { weeks = Math.max(1, weeks-1); upd(); };
  $("#ms-plus").onclick = () => { weeks = Math.min(52, weeks+1); upd(); };
  $("#ms-no").onclick = () => $("#confirm").innerHTML = "";
  const del = $("#ms-del");
  if (del) del.onclick = async () => { $("#confirm").innerHTML = "";
    if (!(await confirmBox(`Eliminare «${m.name}»? Gli allenamenti restano, sparisce solo l'indicazione del mesociclo.`, "Elimina"))) return;
    await saveMesos(a.email, (a.mesos||[]).filter(x => x.id !== m.id)); toast("Mesociclo eliminato"); };
  $("#ms-form").onsubmit = async e => { e.preventDefault();
    const nm = {id: m.id || uid(), name: $("#ms-name").value.trim(), goal: $("#ms-goal").value.trim(), from: monday($("#ms-from").value || m.from), weeks,
      color: (document.querySelector("input[name=ms-c]:checked")||{}).value || MESO_COLORS[0]};
    const targets = isNew ? [...document.querySelectorAll("input[name=ms-a]:checked")].map(c => c.value) : [a.email];
    if (!targets.length) return toast("Scegli almeno un atleta");
    const end = addDays(nm.from, 7*nm.weeks - 1);
    const clash = targets.map(athByEmail).filter(x => (x.mesos||[]).some(o => o.id !== m.id && o.from <= end && addDays(o.from, 7*o.weeks - 1) >= nm.from));
    if (clash.length && !(await confirmBox(`Si sovrappone a un altro mesociclo per: ${clash.map(x => x.name).join(", ")}. Salvare comunque?`, "Salva comunque", false))) return;
    $("#confirm").innerHTML = "";
    for (const em of targets){ const x = athByEmail(em); const list = (x.mesos||[]).filter(o => o.id !== nm.id);
      list.push(isNew && em !== a.email ? {...nm, id: uid()} : nm); await saveMesos(em, list); }
    toast(isNew ? `Mesociclo creato per ${targets.length} ${targets.length === 1 ? "atleta" : "atleti"}` : "Mesociclo salvato"); };
}
async function saveMesos(email, list){
  list.sort((x,y) => x.from.localeCompare(y.from));
  const a = athByEmail(email); await DB.saveAthlete({email, mesos: list}); a.mesos = list;
  if (S.view === "calendar" && $("#calwrap")) drawCalendar();
}

  sets:   {l:"Serie", u:"", d:"Numero di serie registrate: spuntate o compilate, extra comprese."},

const numv = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };
const fmtN = (v, dec=0) => v == null ? "–" : Number(v).toLocaleString("it-IT", {maximumFractionDigits: dec});
const compact = v => v >= 10000 ? (v/1000).toLocaleString("it-IT", {maximumFractionDigits: 1}) + "k" : fmtN(v);
function wStats(w){
  let sets = 0, vol = 0, reps = 0; const ex = {};

    rr.forEach(r => { if (emptyRes(r)) return; sets++; const k = numv(r.kg), rp = numv(r.reps);
      const e = (ex[exName(w, x)] ??= {sets:0, reps:0, vol:0, kgMax:null, hMax:null, tMin:null});
      const hh = numv(r.height), tt = numv(r.time);
      if (hh != null) e.hMax = Math.max(e.hMax ?? 0, hh);
      if (tt != null && tt > 0 && !x.cols.includes("reps")) e.tMin = Math.min(e.tMin ?? Infinity, tt);
      e.sets++; if (rp != null) { reps += rp; e.reps += rp; }
      if (k != null && rp != null) { vol += k*rp; e.vol += k*rp; }
      if (k != null) e.kgMax = Math.max(e.kgMax ?? 0, k); }); });
  const srpe = w.status === "done" && w.sessionRpe && w.durationMin ? w.sessionRpe * w.durationMin : 0;

}
function weeklySeries(email, from, to){
  const w0 = monday(from), n = Math.floor(daysBetween(w0, monday(to)) / 7) + 1, today = TODAY();
  return Array.from({length:n}, (_,k) => { const ws = addDays(w0, k*7), we = addDays(ws, 6);
    const a = ws < from ? from : ws, b = we > to ? to : we;
    const list = wIn(email, a, b);
    const o = {ws, volume:0, sets:0, srpe:0, planned: list.length, done: 0, cut: ws < from || we > to, open: we >= today};
    list.forEach(w => { const st = wStats(w); o.volume += st.vol; o.sets += st.sets; o.srpe += st.srpe; if (w.status === "done") o.done++; });
    return o; });
}

function drawBarChart(el, ser, key, a){
  const W = Math.max(320, el.clientWidth || 700), H = 240, padL = 44, padR = 8, padT = 18, padB = 46;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = niceMax(Math.max(...ser.map(o => o[key]), 0));
  const band = iw / ser.length, bw = Math.min(24, band * 0.62);
  const y = v => padT + ih - (v / max) * ih;
  const curWs = monday(TODAY());
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const hasMeso = (a.mesos||[]).length > 0;
  const mesoUsed = {};
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(METRICS[key].l)} per settimana">
    <g class="grid">${ticks.map(t => `<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
    <g class="axis">${ticks.map(t => `<text x="${padL-8}" y="${y(t)+4}" text-anchor="end">${compact(t)}</text>`).join("")}</g>`;
  const lblEvery = band < 34 ? Math.ceil(34 / band) : 1; const showDate = band >= 52;
  ser.forEach((o, k) => {
    const cx = padL + band*k + band/2, v = o[key], top = y(v), h = padT + ih - top;
    const r = Math.min(4, h, bw/2);
    const path = h > 0 ? `M${cx-bw/2},${padT+ih} V${top+r} Q${cx-bw/2},${top} ${cx-bw/2+r},${top} H${cx+bw/2-r} Q${cx+bw/2},${top} ${cx+bw/2},${top+r} V${padT+ih} Z` : "";
    const cur = o.ws === curWs; const part = o.open || o.cut;
    const mz = mesoAt(a, o.ws); if (mz) mesoUsed[mz.id] = mz;
    svg += `<g class="col" tabindex="0" data-k="${k}" aria-label="Settimana ${weekNo(o.ws)}: ${fmtN(v)} ${METRICS[key].u}">
      <rect class="hit" x="${cx-band/2+1}" y="${padT}" width="${band-2}" height="${ih}" rx="4"/>
      ${path ? `<path class="bar ${part?"part":""}" d="${path}"/>` : ""}
      ${k === ser.length-2 || (v === Math.max(...ser.map(q => q[key])) && v > 0) ? `<text class="vlab" x="${cx}" y="${top-6}" text-anchor="middle">${compact(v)}</text>` : ""}
      ${mz ? `<rect x="${cx-band/2+1}" y="${padT+ih+6}" width="${band-2}" height="4" rx="2" style="fill:${mz.color}"/>` : ""}
    </g>
    <g class="axis">${(ser.length - 1 - k) % lblEvery === 0 ? `<text class="${cur?"cur":""}" x="${cx}" y="${padT+ih+24}" text-anchor="middle">S${weekNo(o.ws)}</text>${showDate || cur ? `<text x="${cx}" y="${padT+ih+37}" text-anchor="middle" style="font-size:10px">${cur ? (showDate ? "in corso" : "ora") : fmtD(o.ws)}</text>` : ""}` : ""}</g>`;
  });
  svg += `</svg><div class="ctip" hidden></div>`;
  const mz = Object.values(mesoUsed);
  if (mz.length) svg += `<div class="clegend">${mz.map(m => `<span style="--c:${m.color}"><i></i>${esc(m.name)}${m.goal ? " · " + esc(m.goal) : ""}</span>`).join("")}</div>`;
  el.innerHTML = svg;
  const tip = el.querySelector(".ctip");
  const show = g => { const o = ser[+g.dataset.k]; const b = g.getBoundingClientRect(), p = el.getBoundingClientRect();
    tip.replaceChildren();
    const tv = document.createElement("div"); tv.className = "tv"; tv.textContent = `${fmtN(o[key])} ${METRICS[key].u}`.trim();
    const tl = document.createElement("div"); tl.className = "tl"; tl.textContent = `Sett. ${weekNo(o.ws)} · ${fmtRange(o.ws)}${o.ws === curWs ? " (in corso)" : o.cut ? " (solo in parte nel periodo)" : ""}`;
    const t2 = document.createElement("div"); t2.className = "tl"; t2.textContent = `Sedute completate ${o.done}/${o.planned}`;
    tip.append(tv, tl, t2); const mm = mesoAt(a, o.ws); if (mm) { const t3 = document.createElement("div"); t3.className = "tl"; t3.textContent = `${mm.name} · settimana ${mm.idx} di ${mm.weeks}`; tip.append(t3); }
    tip.hidden = false;
    let x = b.left - p.left + b.width/2 - tip.offsetWidth/2; x = Math.max(0, Math.min(x, p.width - tip.offsetWidth));
    tip.style.left = x + "px"; tip.style.top = Math.max(0, b.top - p.top - tip.offsetHeight + 10) + "px"; };
  el.querySelectorAll(".col").forEach(g => { g.addEventListener("pointerenter", () => show(g)); g.addEventListener("focus", () => show(g));
    g.addEventListener("pointerleave", () => tip.hidden = true); g.addEventListener("blur", () => tip.hidden = true); });

    </div><footer>${isNew ? "" : `<button type="button" class="btn ghost danger" id="pm-del">Elimina</button>`}<span class="grow"></span><button type="button" class="btn" id="pm-no">Annulla</button><button class="btn pri">Salva</button></footer></form></div>`;
  $("#pm-no").onclick = () => $("#confirm").innerHTML = "";
  const del = $("#pm-del");
  if (del) del.onclick = async () => { $("#confirm").innerHTML = "";
    if (!(await confirmBox(`Eliminare il parametro «${p.label}»? Sparisce dagli elenchi, dalla libreria esercizi e dagli Allenamenti salvati. Negli allenamenti già assegnati i valori inseriti restano leggibili.`, "Elimina"))) return;
    await deleteParam(p.key); };
  $("#pm-form").onsubmit = async ev => { ev.preventDefault();
    const label = $("#pm-l").value.trim().replace(/\s+/g, " "); if (!label) return;
    const clash = Object.entries(COLS_REAL).find(([k, d]) => !d.deleted && d.l.toLowerCase() === label.toLowerCase() && k !== p.key);
    if (clash) return toast(`Esiste già un parametro «${clash[1].l}»`);
    const np = {key: p.key || ("c_" + (label.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 12) || "p") + uid().slice(-4)),
      label, unit: $("#pm-u").value.trim(), log: document.querySelector("input[name=pm-log]:checked").value === "1",
      txt: document.querySelector("input[name=pm-t]:checked").value === "1", archived: !!$("#pm-arch")?.checked};
    const list = (S.params || []).filter(x => x.key !== np.key); list.push(np);
    await DB.saveSettings({params: list}); S.params = list; applyParams(list);
    $("#confirm").innerHTML = ""; toast(isNew ? `Parametro «${label}» creato` : "Parametro salvato");
    if (onDone) onDone(np.key); else renderView(); };
  setTimeout(() => $("#pm-l")?.focus(), 30);
}

async function deleteParam(key){
  // resta salvato come "eliminato" (non compare più da nessuna parte) così gli allenamenti vecchi mostrano ancora il suo nome
  const list = (S.params || []).map(x => x.key === key ? {...x, deleted: true, archived: true} : x);
  await DB.saveSettings({params: list}); S.params = list; applyParams(list);
  const strip = x => { if (!(x.cols || []).includes(key)) return false; x.cols = x.cols.filter(c => c !== key); (x.sets || []).forEach(s => delete s[key]); return true; };
  for (const e of S.exercises) if (strip(e)) await DB.saveExercise(e);
  for (const t of S.templates) { let ch = false; (t.exercises || []).forEach(x => { if (strip(x)) ch = true; }); if (ch) await DB.saveTemplate(t); }
  toast("Parametro eliminato"); renderView();
}

const DEF_OPTS = {
  cat: ["Forza","Potenza","Pliometria","Velocità","Tecnica salto","Core","Mobilità","Riscaldamento","Prevenzione","Condizionamento"],
  pat: ["Squat","Hinge","Monopodalico","Spinta orizzontale","Spinta verticale","Tirata orizzontale","Tirata verticale","Olimpico","Salto","Sprint","Salto in alto","Anti-estensione","Anti-rotazione","Anti-flessione laterale","Trasporto"],
};
const OPT_FIELD = {cat: "category", pat: "pattern"};
function optList(k, extra){
  const seen = new Map();
  [...DEF_OPTS[k], ...S.exercises.map(x => x[OPT_FIELD[k]]), extra].filter(Boolean).forEach(v => { const key = v.trim().toLowerCase(); if (key && !seen.has(key)) seen.set(key, v.trim()); });
  return [...seen.values()].sort((a,b) => a.localeCompare(b, "it"));
}
function optSelect(k, val){
  return `<select class="in" id="x-${k}" data-change="x-opt" data-k="${k}"><option value="">— scegli —</option>${optList(k, val).map(v => `<option value="${esc(v)}" ${v===(val||"")?"selected":""}>${esc(v)}</option>`).join("")}<option value="__new">+ Aggiungi nuova…</option></select>
    <input class="in" id="x-${k}-new" placeholder="Scrivi la nuova voce" hidden style="margin-top:6px">`;
}
function readOpt(k){
  const v = $("#x-"+k)?.value || "";
  if (v !== "__new") return v;
  const t = ($("#x-"+k+"-new")?.value || "").trim().replace(/\s+/g, " "); if (!t) return "";
  const hit = optList(k).find(o => o.toLowerCase() === t.toLowerCase());   // stessa voce scritta diversamente → uso quella già esistente
  return hit || t.charAt(0).toUpperCase() + t.slice(1);
}

const dataQ = {from: addDays(monday(TODAY()), -28), to: TODAY(), who: "all"};
async function collectRows(){
  const ath = activeAthletes().filter(a => dataQ.who === "all" || a.email === dataQ.who);
  const ws = monday(dataQ.from), n = Math.ceil((daysBetween(ws, dataQ.to)+1)/7);
  await Promise.all(ath.map(a => ensureWeeks(a.email, ws, n)));
  const head = ["Data","Data prevista","Settimana","Atleta","Gruppo","Allenamento","Stato","RPE sessione","Durata (min)","Carico sRPE","Mesociclo","Sett. mesociclo","Blocco","Esercizio","Esercizio previsto","Motivo cambio","Categoria","Pattern","Serie","Tipo serie",
    ...COL_KEYS.flatMap(c => COLS[c].log ? [`${COLS[c].l} prog.`, `${COLS[c].l} eseguito`] : [`${COLS[c].l} prog.`]), "Nota atleta"];
  const rows = [];
  ath.forEach(a => wIn(a.email, dataQ.from, dataQ.to).sort((x,y)=>effDate(x).localeCompare(effDate(y))).forEach(w => {
    const st = statusOf(w);
    const L = exLabels(w.exercises);
    const mz = mesoAt(a, effDate(w)) || {};
    (w.exercises||[]).forEach((x, xi) => {
      const done = exName(w, x), lib = libByName(done) || {}, sw = swapOf(w, x);
      const res = (w.results||{})[x.id] || [];
      const n = Math.max(x.sets.length, res.length);
      for (let i=0;i<n;i++){
        const s = x.sets[i] || {}, r = res[i] || {};
        if (i >= x.sets.length && emptyRes(res[i])) continue;
        rows.push([effDate(w), w.date, weekNo(effDate(w)), a.name, a.group||"", w.title, STATUS_TXT[st], w.sessionRpe||"", w.durationMin||"", (w.sessionRpe&&w.durationMin)?w.sessionRpe*w.durationMin:"",
          mz.name ? `${mz.name}${mz.goal ? " · "+mz.goal : ""}` : "", mz.idx || "", L[xi], done, sw ? x.name : "", swapWhy(sw), lib.category||"", lib.pattern||"", i+1, s.type ? SET_TYPES[s.type].l : (i >= x.sets.length ? "Extra" : ""),
          ...COL_KEYS.flatMap(c => COLS[c].log ? [s[c]||"", r[c]||""] : [s[c]||""]), w.athleteNote||""]);
      }
    });
  }));
  return {head, rows};
}

/* ---------- video dentro l'app ----------
   trasforma il link (YouTube, Shorts, Vimeo, Google Drive, Instagram, file .mp4) nell'indirizzo del lettore "incorporato";
   se il sito non si può incorporare restituisce null e il link si apre in una pagina nuova come prima */
function videoEmbed(url){
  let u; try { u = new URL(String(url||"").trim()); } catch(e) { return null; }
  const h = u.hostname.replace(/^(www|m|mobile)\./, ""), path = u.pathname;
  const secs = t => { if (!t) return 0; if (/^\d+$/.test(t)) return +t; const m = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/); return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0; };
  const yt = (id, tall) => id && {src: `https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1&modestbranding=1${secs(u.searchParams.get("t") || u.searchParams.get("start")) ? "&start=" + secs(u.searchParams.get("t") || u.searchParams.get("start")) : ""}`, tall, site: "YouTube"};
  let m;
  if (h === "youtu.be") return yt(path.slice(1).split("/")[0]);
  if (h === "youtube.com" || h === "youtube-nocookie.com") {
    if (u.searchParams.get("v")) return yt(u.searchParams.get("v"));
    if ((m = path.match(/^\/(shorts|embed|live)\/([\w-]+)/))) return yt(m[2], m[1] === "shorts"); }
  if (h === "vimeo.com" && (m = path.match(/^\/(\d+)/))) return {src: `https://player.vimeo.com/video/${m[1]}`, site: "Vimeo"};
  if (h === "player.vimeo.com") return {src: u.href, site: "Vimeo"};
  if (h === "drive.google.com") { const id = (path.match(/\/file\/d\/([\w-]+)/) || [])[1] || u.searchParams.get("id");
    if (id) return {src: `https://drive.google.com/file/d/${id}/preview`, site: "Google Drive", drive: true}; }
  if (h === "instagram.com" && (m = path.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/))) return {src: `https://www.instagram.com/${m[1] === "reels" ? "reel" : m[1]}/${m[2]}/embed`, tall: true, site: "Instagram"};
  if (/\.(mp4|webm|m4v|mov)$/i.test(path)) return {src: u.href, file: true, site: "il video"};
  return null;
}
