<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232650D6'/%3E%3Crect x='6' y='7' width='3' height='19' fill='%23fff'/%3E%3Crect x='23' y='7' width='3' height='19' fill='%23fff'/%3E%3Crect x='4' y='12' width='24' height='3' fill='%23fff'/%3E%3C/svg%3E">
<title>Asticella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#EBEEF3; --ink:#131821; --muted:#5B6476; --faint:#8C95A5; --line:#DDE2EA;
  --accent:#2650D6; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --ok:#14825A; --ok-soft:#DCF1E7; --warn:#AD6F08; --warn-soft:#FAEED4; --bad:#BF3737; --bad-soft:#F7E0E0;
  --shadow:0 1px 2px rgba(19,24,33,.06),0 10px 30px rgba(19,24,33,.10);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  --blk0:#2650D6;--blk1:#8A3FD1;--blk2:#0E7C86;--blk3:#C2570C;--blk4:#C0266D;--blk5:#4D7A12;--blk6:#5B6476;
  --circ:#1baf7a;--chip:13%;
  --ms0:#2650D6;--ms1:#14825A;--ms2:#B7770B;--ms3:#BF3737;--ms4:#7A3FC4;--ms5:#0E7C86;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C0F14; --surface:#151920; --surface2:#1C2129; --ink:#E6E9EF; --muted:#9AA3B3; --faint:#6D7686; --line:#272D37;
    --accent:#7D97FF; --accent-ink:#0C0F14; --accent-soft:#1C2444;
    --ok:#3DC88B; --ok-soft:#11281E; --warn:#E6AA3C; --warn-soft:#2D2311; --bad:#F06C6C; --bad-soft:#321717;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
    --blk0:#7D97FF;--blk1:#C08BFF;--blk2:#3CC3CE;--blk3:#F29A55;--blk4:#F27AAE;--blk5:#9CCB5A;--blk6:#9AA3B3;
  --circ:#3CC48F;--chip:24%;
  --ms0:#7D97FF;--ms1:#3DC88B;--ms2:#E6AA3C;--ms3:#F06C6C;--ms4:#C08BFF;--ms5:#3CC3CE;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0F14; --surface:#151920; --surface2:#1C2129; --ink:#E6E9EF; --muted:#9AA3B3; --faint:#6D7686; --line:#272D37;
  --accent:#7D97FF; --accent-ink:#0C0F14; --accent-soft:#1C2444;
  --ok:#3DC88B; --ok-soft:#11281E; --warn:#E6AA3C; --warn-soft:#2D2311; --bad:#F06C6C; --bad-soft:#321717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  --blk0:#7D97FF;--blk1:#C08BFF;--blk2:#3CC3CE;--blk3:#F29A55;--blk4:#F27AAE;--blk5:#9CCB5A;--blk6:#9AA3B3;
  --circ:#3CC48F;--chip:24%;
  --ms0:#7D97FF;--ms1:#3DC88B;--ms2:#E6AA3C;--ms3:#F06C6C;--ms4:#C08BFF;--ms5:#3CC3CE;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior-y:none}
#ptr{white-space:nowrap;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translate(-50%,-70px);z-index:95;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;pointer-events:none;transition:transform .18s}
#ptr.ready{color:var(--accent)}
#ptr svg{width:16px;height:16px}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.nav.mob{display:none}
.acct{font-size:12px;color:var(--faint);margin-top:2px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,table{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.icon{padding:5px 8px}
.btn[disabled]{opacity:.5;cursor:default}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:60px}
.field{display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

/* demo bar */
.pvbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--warn-soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.pvbar span{flex:1;min-width:200px}
.demobar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--accent-soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.demobar b{font-family:var(--display);font-size:15px;letter-spacing:.04em;color:var(--accent)}
.demobar select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}

/* coach shell */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;padding:16px;min-height:calc(100% - 44px)}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand svg{flex:none}
.brand span{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;text-align:left;font-weight:500;color:var(--muted)}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.nav svg{width:17px;height:17px;flex:none}
.side .who{margin-top:24px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
main{min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead .sub{color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.weeknav{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.weeknav .btn{border:0;padding:5px 9px}
.weeknav .wl{padding:0 8px;font-weight:600;min-width:140px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* overview */
table.ov{border-collapse:separate;border-spacing:0;width:100%;min-width:960px}
.ov th,.ov td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.ov thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
.ov thead th.today{color:var(--accent)}
.ov td.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.ov tbody tr:last-child td{border-bottom:0}
.ov .ath{min-width:160px}
.ov .ath button{border:0;background:none;padding:0;font-weight:600;text-align:left}
.ov .ath button:hover{color:var(--accent)}
.ov .ath small{display:block;color:var(--faint);font-size:11px}
.ov td.day{min-width:96px;position:relative}
.ov td.day .add{opacity:0;position:absolute;right:4px;bottom:4px}
.ov td.day:hover .add{opacity:1}
.chip{display:flex;align-items:center;gap:6px;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:4px 7px;font-size:12px;font-weight:600;text-align:left;margin-bottom:4px;line-height:1.25}
.chip:hover{border-color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.st-done .dot,.dot.st-done{background:var(--ok)}
.st-progress .dot,.dot.st-progress{background:var(--warn)}
.st-skipped .dot,.dot.st-skipped,.st-missed .dot,.dot.st-missed{background:var(--bad)}
.st-todo .dot,.dot.st-todo{background:transparent;border:1.5px solid var(--faint)}
.chip.st-done{background:var(--ok-soft);border-color:transparent}
.chip.st-missed{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.st-skipped{background:var(--bad-soft);border-color:transparent}
.chip.st-progress{background:var(--warn-soft);border-color:transparent}
.stat{font-family:var(--display);font-size:20px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* calendar */
.cal{display:grid;grid-template-columns:64px repeat(7,minmax(136px,1fr));min-width:1020px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .rail{grid-column:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px;gap:8px;background:var(--surface2)}
.cal .rail .wk{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
.cal .rail .wk small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:500;margin-top:6px}
.cal .rail.cur{background:var(--accent-soft)}
.cal .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:150px;display:flex;flex-direction:column;gap:6px;position:relative}
.cal .cell.sun{border-right:0}
.stb{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 3px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.stb.t-R{background:var(--surface2);color:var(--muted)}
.stb.t-W{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stb.t-B{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stb.t-D{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tbtn{border:1px dashed var(--line);background:transparent;border-radius:6px;width:30px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px}
.tbtn:hover{border-color:var(--accent)}
.tbtn.has{border-style:solid;border-color:transparent}
.lt td.n .stb{margin-top:2px}
.lt td.n{line-height:1.1}
.tlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.tlegend span{display:inline-flex;gap:4px;align-items:center}
/* mesocicli */
.mband{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--mc) 14%,var(--surface));border-left:4px solid var(--mc);cursor:pointer;text-align:left;border-top:0;border-right:0;font:inherit;color:inherit}
.mband:hover{background:color-mix(in srgb,var(--mc) 22%,var(--surface))}
.mband b{font-family:var(--display);font-size:17px;font-weight:700;color:var(--mc);letter-spacing:.02em}
.mband .g{font-weight:600}
.mband .r{color:var(--muted);font-size:12px}
.mband .e{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.cal .rail.inm{box-shadow:inset 4px 0 0 var(--mc);background:color-mix(in srgb,var(--mc) 10%,var(--surface2))}
.cal .rail .mw{font-size:11px;font-weight:700;color:var(--mc);writing-mode:horizontal-tb}
.swatches{display:flex;gap:8px}
.swatches label{width:28px;height:28px;border-radius:50%;background:var(--c);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border:2px solid transparent}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.mesochip{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:8px;background:color-mix(in srgb,var(--mc) 14%,var(--surface));border-left:3px solid var(--mc);font-size:13px}
.mesochip b{color:var(--mc);white-space:nowrap;margin-right:8px}
.cal .cell.drop{background:var(--accent-soft)}
.wcard.insb{box-shadow:0 -4px 0 -1px var(--accent)}
.cal .cell.inse::after{content:"";display:block;height:3px;border-radius:2px;background:var(--accent)}
.wcard.dragging{opacity:.45}
.cal .cell.drop.cp{background:color-mix(in srgb,var(--ok) 14%,var(--surface));outline:2px dashed var(--ok);outline-offset:-3px}
.wcard.sel{outline:2.5px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 5px var(--accent-soft)}
.calsel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12px;color:var(--muted);margin:0 0 8px;min-height:30px}
.calsel.on{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:4px 6px 4px 12px}
.calsel.on span{color:var(--muted)}
.calsel kbd{font-family:inherit;font-size:11px;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.lasso{position:fixed;z-index:40;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:4px;pointer-events:none}
body.nosel{user-select:none}
@media (hover:none){.calsel:not(.on){display:none}}
.cal .cell.past{background:color-mix(in srgb,var(--surface2) 40%,var(--surface))}
.cal .dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.cal .dh .d{font-variant-numeric:tabular-nums}
.cal .cell.today .dh .d{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px}
.cal .dh .btn{opacity:0;padding:1px 6px}
.cal .cell:hover .dh .btn{opacity:1}
.wcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 8px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.wcard:hover{border-color:var(--accent)}
.wcard .t{display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px;line-height:1.2}
.wcard .t .vis{margin-left:auto;flex:none;align-self:flex-start;border:0;background:none;padding:3px;margin:-3px -4px 0 0;border-radius:6px;color:var(--faint);display:flex;cursor:pointer}
.wcard .t .vis:hover{color:var(--ink);background:var(--surface2)}
.wcard .t .vis svg{width:15px;height:15px}
.wcard.hid{border-top-style:dashed;border-right-style:dashed;border-bottom-style:dashed;background:color-mix(in srgb,var(--warn) 5%,var(--surface))}
.wcard.hid .t .vis{color:var(--warn)}
.wcard .hidl{font-size:10.5px;font-weight:700;color:var(--warn);margin-top:2px}
.chip .chiphid{margin-left:auto;display:flex;color:var(--warn)}.chip .chiphid svg{width:13px;height:13px}
.vispill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.vispill svg{width:14px;height:14px}
.vispill:hover{color:var(--ink);border-color:var(--faint)}
.vispill.off{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.wcard ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.wcard li{font-size:12px;display:grid;grid-template-columns:minmax(14px,auto) 1fr;column-gap:5px;line-height:1.25}
.wcard li .b{color:var(--bc,var(--accent));font-weight:700;font-size:11px}
.wcard li .s{grid-column:2;color:var(--muted);font-size:11px}
/* testi lunghi senza spazi (es. 60/100/150/200/150/100/60 m): vanno a capo invece di uscire dalla scheda (iPad) */
.wcard li > span,.tpl li > span,.chip{min-width:0;overflow-wrap:break-word}
.api > div{min-width:0}.api .nm,.api .sc,.aex .info,.aex .cscheme,.aex .h .n{overflow-wrap:break-word}
.wcard.st-done{border-left:3px solid var(--ok)}
.wcard.st-progress{border-left:3px solid var(--warn)}
.wcard.st-missed,.wcard.st-skipped{border-left:3px solid var(--bad)}
.wcard .kindt{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.wcard .moved{margin-top:3px;font-size:11px;color:var(--muted);font-style:italic}
.wcard .meta{margin-top:5px;font-size:11px;color:var(--ok);font-weight:600}

/* lists */
table.list{width:100%;border-collapse:collapse}
.list th,.list td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.list th{font-size:12px;color:var(--muted);font-weight:600}
.list tr:last-child td{border-bottom:0}
.ov tr.grprow th{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;position:static}
.list tr.grprow th{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.note{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note code{background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--ink);word-break:break-all}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.tpl:hover{border-color:var(--accent)}
.tpl-main{border:0;background:none;text-align:left;padding:12px 14px 8px;display:flex;flex-direction:column;gap:2px}
.tpl-main .t{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.tpl ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.tpl li{font-size:13px;display:grid;grid-template-columns:minmax(16px,auto) 1fr;column-gap:6px}
.tpl li .b{color:var(--bc,var(--accent));font-weight:700;font-size:12px}
.wcard li,.tpl li{position:relative}
.wcard li.link::after,.tpl li.link::after{content:"";position:absolute;left:8px;top:15px;bottom:-2px;width:1.5px;border-radius:1px;background:color-mix(in srgb,var(--bc) 55%,transparent)}
.tpl li .s{grid-column:2;color:var(--muted);font-size:12px}
.tpl-foot{display:flex;gap:6px;padding:8px 12px 12px;border-top:1px solid var(--line);margin-top:6px}
.colpick{display:flex;flex-wrap:wrap;gap:6px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:340px;overflow-y:auto}
.prow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.prow:last-child{border-bottom:0}
.prow > span:first-child{flex:1}
.prow > span.faint{font-size:11px}
.prow.off{opacity:.55}
.colpick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.colpick button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* modal */
.back{position:fixed;inset:0;background:rgba(8,10,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:900px;display:flex;flex-direction:column;border:1px solid var(--line);max-height:calc(100dvh - 48px)}
.modal.sm{max-width:460px;background:var(--surface)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{flex:1}
.modal.pgm header h2{flex:0 1 auto}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;flex:1}
.modal footer{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;background:inherit;border-radius:0 0 14px 14px}
.dirty{font-size:12px;color:var(--warn);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-head .blk{width:46px;text-align:center;font-weight:700;color:var(--bc,var(--accent))}
.ex-head .nm{font-weight:600;font-size:15px}
.cols{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cols .c{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.cols .c button{border:0;background:transparent;color:inherit;padding:0 5px;font-size:14px;line-height:1}
.cols .c button.mv{padding:0 3px;font-size:13px;opacity:.55}
.cols .c button.mv:hover{opacity:1}
.cols .c button[disabled]{visibility:hidden}
.ssg{border:2px solid var(--accent);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--accent-soft)}
.ssg-h{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--accent);padding:0 4px;display:flex;gap:8px;align-items:baseline}
.ssg-h span{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted)}
.ssg-h{flex-wrap:wrap}.ssg-h .grpkind{margin-left:auto;align-self:center}
.seg.sm button{padding:3px 9px;font-size:12px}
.ssg.circ{border-color:var(--circ);background:color-mix(in srgb,var(--circ) 9%,var(--surface))}
.ssg.circ .ssg-h{color:var(--circ)}
.ssg.circ .grpkind button.on,.circset .seg button.on{background:color-mix(in srgb,var(--circ) 16%,var(--surface));color:var(--circ)}
.circset{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:2px 4px 6px;font-size:13px}
.circset .cf{display:inline-flex;align-items:center;gap:6px}
.circset .cf .lbl{margin:0}
.circset .cin{width:56px;padding:4px 6px;text-align:center}.circset .cin.w{width:80px}
.circset .stepper button{width:26px;height:26px}
.sets td.n.gn{font-weight:700;color:var(--circ);white-space:nowrap}
.sslink{display:flex;justify-content:center;margin:-6px 0}
.sslink .btn{border-style:dashed;color:var(--muted);font-weight:500}
.sslink .btn.on{border-style:solid;color:var(--accent);background:var(--surface)}
.side-in{display:inline-flex;gap:3px}
.side-in button{width:36px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);font-weight:700;font-size:14px;color:var(--muted)}
.side-in button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.side-in button.plan{border:2px dashed var(--accent);color:var(--ink)}
.aex .sidehint{color:var(--ink)}
.sets select{width:84px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:var(--surface2)}
.cols select{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:3px 8px;font-size:12px;color:var(--muted)}
table.sets{border-collapse:collapse}
.sets th{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:2px 4px;text-transform:uppercase;letter-spacing:.05em}
.sets td{padding:2px 3px}
.sets td.n{color:var(--faint);font-size:12px;text-align:center;width:24px}
.sets input{width:74px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:var(--surface2)}
.sets input:focus{background:var(--surface);border-color:var(--accent);outline:none}
.sets .ra{white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface2);width:28px;height:28px;font-size:16px;font-weight:600}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.done-box{border-radius:8px;background:var(--ok-soft);padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.done-box.warnb{background:var(--warn-soft)}
.done-box.badb{background:var(--bad-soft)}
.done-box b{font-size:12px}
button.done-box{border:1px solid transparent;text-align:left;width:100%;color:inherit;position:relative;padding-right:90px}
button.done-box:hover{border-color:var(--ok)}
button.done-box.warnb:hover{border-color:var(--warn)} button.done-box.badb:hover{border-color:var(--bad)}
.done-box .fix{position:absolute;right:10px;top:8px;font-weight:600;color:var(--muted)}
button.done-box:hover .fix{color:var(--ink)}
.fixt input{width:70px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 4px;background:var(--surface2)}
.fixt select{border:1px solid var(--line);border-radius:6px;padding:6px 4px;background:var(--surface2)}
.fixt td,.fixt th{padding:3px}
.fixt th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.done-sets{display:flex;flex-wrap:wrap;gap:4px 10px}
.checks{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto}
.checks .grp{display:flex;flex-direction:column;gap:4px}
.checks label{display:flex;gap:8px;align-items:center;padding:3px 0}

/* toast/confirm */
#toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:90;box-shadow:var(--shadow);transition:opacity .2s}
#toast[hidden]{display:none}

/* login */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.card .logo{display:flex;align-items:center;gap:10px}
.card .logo span{font-family:var(--display);font-size:30px;font-weight:700}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:13px}

/* athlete */
.aw{max-width:560px;margin:0 auto;padding:12px 16px calc(140px + env(safe-area-inset-bottom,0px))}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.ahead h1{font-size:26px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.strip button{border:1px solid transparent;background:var(--surface);border-radius:10px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.strip button .dn{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.strip button .dd{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.strip button .dots{display:flex;gap:2px;height:8px;align-items:center}
.strip button.sel{border-color:var(--accent);background:var(--accent-soft)}
.strip button.today .dd{color:var(--accent)}
.alist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.acard .t{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;font-weight:600}
.acard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.aplan{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.api{display:grid;grid-template-columns:32px 1fr;column-gap:10px;align-items:start}
.api .lc{position:relative;align-self:stretch;display:flex;justify-content:center}
.api .lab{position:relative;z-index:1;min-width:32px;height:24px;padding:0 4px;border-radius:7px;background:color-mix(in srgb,var(--bc) var(--chip),var(--surface));color:var(--bc);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.api.link .lc::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:24px;bottom:-12px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--bc) 50%,transparent)}
.apgrp{position:relative;margin:4px 0}
.apgrp:first-child{margin-top:0}.apgrp:last-child{margin-bottom:0}
.apgrp::before{content:"";position:absolute;left:-9px;top:2px;bottom:-2px;width:4px;border-radius:3px;background:var(--bc);opacity:.8}
.apgrp .aplan{margin:0}
.api.single{position:relative;margin:4px 0}
.api.single::before{content:"";position:absolute;left:-9px;top:-4px;bottom:-2px;width:4px;border-radius:3px;background:var(--bc);opacity:.8}
.apgh{margin-left:1px !important;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--bc);margin:0 0 6px 2px}
.api .nm{font-weight:600;font-size:15px;color:var(--ink);line-height:1.25;padding-top:2px}
.api .sc{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.api .sst{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--bc);vertical-align:2px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.status-pill.st-done{background:var(--ok-soft);color:var(--ok)}
.status-pill.st-progress{background:var(--warn-soft);color:var(--warn)}
.status-pill.st-skipped,.status-pill.st-missed{background:var(--bad-soft);color:var(--bad)}
.wo-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0}
.wo-top .ttl{flex:1;min-width:0}
.wo-top .ttl h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--faint);white-space:nowrap}
.cnote{background:var(--surface);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.aex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.aex .h{display:flex;gap:8px;align-items:baseline}
.aex .h .b{font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px}
.aex.ssbox,.aex.circbox{border:1px solid var(--line) !important;border-left:5px solid var(--gc,var(--accent)) !important}
.aex.circbox{border-left-color:var(--circ) !important}
.aex.ssbox .h .b,.aex.single .h .b{color:var(--gc,var(--accent))}
.aex.single{position:relative}
.aex.single{border-left:5px solid var(--gc,var(--accent)) !important}
.aex.circbox{border:2px solid var(--circ)}
.aex.circbox .sshead{color:var(--circ)}
.mtag{display:inline-block;margin:1px 0 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:1px 6px;white-space:nowrap}
td.rh .mtag{display:table;margin-top:2px}.hsess .hh .mtag{align-self:flex-start;margin-top:3px}
.mtag.circ{background:color-mix(in srgb,var(--circ) 14%,var(--surface));color:var(--circ)}.mtag.ss{background:var(--accent-soft);color:var(--accent)}
.aex .chow{font-size:13px;line-height:1.4;background:color-mix(in srgb,var(--circ) 10%,var(--surface));border-radius:8px;padding:8px 10px;color:var(--ink)}
.aex.circbox .h .b,.crow .cnm b{color:var(--circ) !important}
.aex .cscheme{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.clogwrap{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.cgiro{display:flex;flex-direction:column;gap:6px}
.cgh{font-family:var(--display);font-weight:700;font-size:16px;color:var(--circ);letter-spacing:.03em}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 42px;grid-template-areas:"nm ck" "fs ck";gap:4px 8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface2)}
.crow.ok{background:var(--ok-soft)}
.crow .cnm{grid-area:nm;font-size:13.5px;font-weight:600}
.crow .cfs{grid-area:fs;display:flex;flex-wrap:wrap;gap:6px}
.crow .ck{grid-area:ck}
.crow.ok .ck{background:var(--ok);border-color:var(--ok)}.crow.ok .ck svg{stroke:#fff}
.cfl{display:flex;flex-direction:column;gap:2px}.cfl .fl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.cfl input,.cfl .pick,.cfl .ro{width:72px !important;min-width:0;height:38px !important}
.crow.ok input,.crow.ok .pick{background:var(--surface);border-color:transparent}
.crounds{display:flex;flex-wrap:wrap;gap:8px}
.cround-ck{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.cround-ck svg{width:18px;height:18px;stroke:var(--faint)}
.cround-ck.on{background:var(--ok);border-color:var(--ok);color:#fff}.cround-ck.on svg{stroke:#fff}
.clog{display:flex;flex-direction:column;gap:12px}.clog.amrap{flex-direction:row;flex-wrap:wrap;gap:12px}
.crow2{display:flex;flex-wrap:wrap;gap:12px}
.cfld{display:flex;flex-direction:column;gap:4px}.cfld .lbl{margin:0}
.cfld .lt input,.cfld .lt .pick{width:80px}
.cnote2{font-size:12px;width:100%}
.aex .sshead{font-family:var(--sans);font-weight:800;color:var(--accent);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.aex .sshead span{display:block;font-family:var(--sans);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--muted);text-transform:none;margin-top:2px}
.aex .sub{display:flex;flex-direction:column;gap:8px}
.aex .sub + .sub{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.aex .h .n{font-weight:700;font-size:16px;flex:1}
.aex .info{font-size:13px;color:var(--muted);white-space:pre-wrap}
.aex .histbtn{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink)}
.aex .histrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.aex .histbtn .arr{font-size:15px;line-height:1;margin-left:2px;color:var(--muted)}
.hsess{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.hsess:last-of-type{border-bottom:0}
.hsess .hh{display:flex;flex-direction:column}
.hsess .hh b{font-size:14px}
.hsess .hh span{font-size:12px;color:var(--muted)}
table.ht{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.ht th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:2px 12px 4px 0;white-space:nowrap}
table.ht td{padding:3px 12px 3px 0;white-space:nowrap}
table.ht td.n{color:var(--muted);font-weight:600}
.aex a{color:var(--accent);font-size:13px;font-weight:600}
/* video dentro l'app */
.aex .vbtn{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:600}
#vid .vback{position:fixed;inset:0;z-index:90;background:rgba(10,12,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#vid .vwrap{background:var(--surface);border-radius:14px;overflow:hidden;width:min(900px,100%);display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
#vid .vwrap.tall{width:min(420px,100%)}
#vid .vhead{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
#vid .vhead b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vid .vframe{position:relative;background:#000;aspect-ratio:16/9;max-height:calc(100dvh - 130px)}
#vid .vwrap.tall .vframe{aspect-ratio:9/16}
#vid .vframe iframe,#vid .vframe video{position:absolute;inset:0;width:100%;height:100%;border:0}
#vid .vfoot{padding:8px 14px;font-size:12px;color:var(--muted)}
#vid .vhead .vfs{white-space:nowrap;font-size:12px}
/* Google Drive: non sappiamo se il video è verticale o orizzontale → riquadro alto, il lettore di Drive lo centra da solo */
#vid .vwrap.drv{width:min(560px,100%)}
#vid .vwrap.drv .vframe{aspect-ratio:auto;height:min(72dvh,720px)}
/* telefono: finestra più larga possibile */
@media (max-width:700px){ #vid .vback{padding:8px} #vid .vwrap,#vid .vwrap.tall,#vid .vwrap.drv{width:100%} #vid .vwrap{max-height:calc(100dvh - 16px)} }
/* schermo intero (anche finto, per iPhone) */
#vid .vwrap.full{position:fixed;inset:0;width:100%!important;max-height:none;height:100dvh;border-radius:0}
#vid .vwrap.full .vframe{flex:1;aspect-ratio:auto;height:auto;max-height:none}
#vid .vwrap.full .vfoot{display:none}
#vid .vwrap.full{background:#000} #vid .vwrap.full .vhead{padding:2px 4px 2px 12px;color:#fff} #vid .vwrap.full .vhead .btn{color:#fff}
#vid .vback:fullscreen{padding:0;background:#000}
#vid .vfoot a{color:var(--accent);font-weight:600}
body.noscroll{overflow:hidden}
/* progressione nell'editor */
.prog{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.prog.empty{padding:7px 12px;font-size:12px}
.prog-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--surface2);padding:7px 12px;font-size:13px;text-align:left;flex-wrap:wrap}
.prog-h .car{color:var(--muted);width:10px}
.prog-h .trend{margin-left:auto;font-size:12px;color:var(--muted)}
.prog-h .trend b{color:var(--ink)}
.prog .pos{color:var(--ok);font-weight:700}.prog .neg{color:var(--bad);font-weight:700}
.spk{flex:none}.spk polyline{fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}.spk circle{fill:var(--accent)}
table.progt{width:100%;border-collapse:collapse;font-size:12.5px}

/* iPhone/iPad: evita che la pagina resti ingrandita (tornando nell'app dopo averla lasciata, o toccando una casella piccola). maximum-scale=1 lo evita (su iOS lo zoom con due dita resta possibile). */
(function(){ var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!ios) return; var m = document.querySelector('meta[name="viewport"]');
  if (!m) { m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m); }
  var V = "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"; m.setAttribute("content", V);
  /* quando si torna nell'app (dopo averla lasciata in background) iPad a volte la ritrova ingrandita:
     si "ricorda" a Safari la scala giusta, cambiando il viewport per un attimo e poi rimettendolo */
  var fix = function(){ m.setAttribute("content", V + ", minimum-scale=1"); setTimeout(function(){ m.setAttribute("content", V); }, 60); };
  window.addEventListener("pageshow", fix); window.addEventListener("orientationchange", fix);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") fix(); }); })();

function LocalDB(){
  const KEY = "asticella-demo-v2";
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) { st = null; }
  if (!st) st = seedDemo();
  if (!st.templates) st.templates = seedDemo().templates;
  if (!st.v6) { demoV6(st); st.v6 = true; }
  if (!st.v9) { demoHistory(st); st.v9 = true; }
  if (!st.v22) { demoSwaps(st); st.v22 = true; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
  save();
  const wait = v => new Promise(r => setTimeout(() => r(clone(v)), 60));
  return {
    reset(){ st = seedDemo(); demoV6(st); st.v6 = true; demoHistory(st); st.v9 = true; demoSwaps(st); st.v22 = true; save(); },
    async listAthletes(){ return wait(Object.values(st.athletes)); },
    async getAthlete(e){ return wait(st.athletes[e] || null); },
    async saveAthlete(a){ st.athletes[a.email] = {...(st.athletes[a.email]||{}), ...clone(a)}; st.workouts[a.email] ??= {}; save(); return wait(a); },
    async listExercises(){ return wait(Object.values(st.exercises)); },
    async saveExercise(x){ st.exercises[x.id] = clone(x); save(); return wait(x); },
    async deleteExercise(id){ delete st.exercises[id]; save(); return wait(true); },
    async listTemplates(){ return wait(Object.values(st.templates || {})); },
    async getSettings(){ return wait(st.settings || {}); },
    async saveSettings(x){ st.settings = {...(st.settings||{}), ...clone(x)}; save(); return wait(true); },
    async saveTemplate(t){ (st.templates ??= {})[t.id] = clone(t); save(); return wait(t); },
    async deleteTemplate(id){ delete st.templates[id]; save(); return wait(true); },
    async listWorkouts(e, from, to){ return wait(Object.values(st.workouts[e] || {}).filter(w => w.date >= from && w.date <= to)); },
    async createWorkout(e, w){ (st.workouts[e] ??= {})[w.id] = clone(w); save(); return wait(w); },
    async saveWorkout(e, w){ const cur = st.workouts[e]?.[w.id] || {}; const p = {}; COACH_FIELDS.forEach(k => { if (w[k] !== undefined) p[k] = w[k]; });
      (st.workouts[e] ??= {})[w.id] = {...cur, ...clone(p)}; save(); return wait(true); },
    async deleteWorkout(e, id){ delete st.workouts[e]?.[id]; save(); return wait(true); },
    async saveResults(e, id, patch){ Object.assign(st.workouts[e][id], clone(patch)); save(); return wait(true); },
  };
}

function FirebaseDB(F, db){
  const W = (e) => F.collection(db, "athletes", e, "workouts");
  const docs = snap => snap.docs.map(d => ({...d.data(), id: d.id}));
  const cleanObj = o => JSON.parse(JSON.stringify(o));
  // Se il server non risponde entro 7 secondi (rete lenta in palestra, telefono appena riattivato)
  // si usano i dati già salvati sul telefono invece di restare bloccati.
  const fast = async (serverCall, cacheCall) => {
    let t; const slow = new Promise((_, rej) => { t = setTimeout(() => rej({code: "slow"}), 7000); });
    try { return await Promise.race([serverCall(), slow]); }
    catch(e) { if (e?.code !== "slow") throw e; S.slow = true; return await cacheCall(); }
    finally { clearTimeout(t); }
  };
  return {
    async listAthletes(){ return docs(await F.getDocs(F.collection(db, "athletes"))); },
    async getAthlete(e){ const r = F.doc(db, "athletes", e); const s = await fast(() => F.getDoc(r), () => F.getDocFromCache(r)); return s.exists() ? s.data() : null; },
    async saveAthlete(a){ await F.setDoc(F.doc(db, "athletes", a.email), cleanObj(a), {merge:true}); return a; },
    async listExercises(){ const q = F.collection(db, "exercises"); return docs(await fast(() => F.getDocs(q), () => F.getDocsFromCache(q))); },
    async saveExercise(x){ await F.setDoc(F.doc(db, "exercises", x.id), cleanObj(x)); return x; },
    async deleteExercise(id){ await F.deleteDoc(F.doc(db, "exercises", id)); },
    async listTemplates(){ return docs(await F.getDocs(F.collection(db, "templates"))); },
    async getSettings(){ const r = F.doc(db, "settings", "app");
      try { const s = await fast(() => F.getDoc(r), () => F.getDocFromCache(r)); return s.exists() ? s.data() : {}; } catch(e) { console.warn(e); return {}; } },
    async saveSettings(x){ await F.setDoc(F.doc(db, "settings", "app"), cleanObj(x), {merge:true}); },
    async saveTemplate(t){ await F.setDoc(F.doc(db, "templates", t.id), cleanObj(t)); return t; },
    async deleteTemplate(id){ await F.deleteDoc(F.doc(db, "templates", id)); },
    async listWorkouts(e, from, to){ const q = F.query(W(e), F.where("date", ">=", from), F.where("date", "<=", to)); return docs(await fast(() => F.getDocs(q), () => F.getDocsFromCache(q))); },
    async createWorkout(e, w){ await F.setDoc(F.doc(W(e), w.id), cleanObj(w)); return w; },
    async saveWorkout(e, w){ const p = {}; COACH_FIELDS.forEach(k => { if (w[k] !== undefined) p[k] = w[k]; });
      await F.setDoc(F.doc(W(e), w.id), cleanObj(p), {merge:true}); },
    async deleteWorkout(e, id){ await F.deleteDoc(F.doc(W(e), id)); },
    async saveResults(e, id, patch){ await F.updateDoc(F.doc(W(e), id), cleanObj(patch)); },
  };
}

async function ensureWeeks(email, ws, n, force=false){
  const set = (S.loaded[email] ??= new Set());
  const cache = (S.cache[email] ??= {});
  const need = [];
  for (let i=0;i<n;i++){ const w = addDays(ws, i*7); if (force || !set.has(w)) need.push(w); }
  if (!need.length) return;
  const from = need[0], to = addDays(need[need.length-1], 6);
  const slowBefore = S.slow; S.slow = false;

  exs = exs || []; const L = exLabels(exs);
  const item = (x, i, col, link, c) => `<li class="api ${link ? "link" : ""} ${c === "single" ? "single" : ""}" style="--bc:${col}"><div class="lc"><span class="lab">${esc(L[i] || "•")}</span></div>
      <div><div class="nm">${esc(exName(w, x))}</div>${swapOf(w, x) ? `<div class="sc swl">↔ al posto di ${esc(x.name)}</div>` : ""}<div class="sc">${esc(c && c !== "single" ? (c.fmt === "amrap" && !amrapReps(c) ? "per giro: " : "") + circScheme(x, amrapReps(c)) : schemeText(x)).replace(/\//g, "/<wbr>")}</div></div></li>`;
  /* superserie e circuiti: un riquadro che raccoglie gli esercizi collegati, con il nome del metodo in alto */
  return `<ul class="aplan">${ssGroups(exs).map(g => { const c = circOfGroup(exs, g), lead = exs[g[0]];
    if (g.length === 1 && !c) return item(lead, g[0], blockColor(lead.block || L[g[0]]), false, "single");
    const col = c ? "var(--circ)" : blockColor(lead.block || L[g[0]]);
    const head = c ? circTag(c, lead.sets.length, g.length) + ((c.fmt === "giri" || c.fmt === "tempo") && c.rest ? ` · rec. ${c.rest}` : "") : `superserie · alterna ${g.map(i => L[i]).join(" → ")}`;
    return `<li class="apgrp" style="--bc:${col}"><div class="apgh">${esc(head)}</div><ul class="aplan">${g.map((i, k) => item(exs[i], i, col, k < g.length - 1, c)).join("")}</ul></li>`; }).join("")}</ul>`;
}
/* profili "senza accesso" (squadre o atleti che non usano l'app): hanno un codice al posto dell'email,
   con dominio .local, dove non arriva nessuna email di conferma → nessuno può entrare con quel profilo */
const isNoAccess = a => !!a && (a.noAccess || /\.local$/.test(a.email || ""));
const noAccessId = name => (String(name).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "profilo") + "-" + Math.random().toString(36).slice(2, 6) + "@senza-accesso.local";
function resultLine(r, cols){ return cols.filter(c => COLS[c].log && r[c]).map(c => fmtVal(c, r[c])).join(" · "); }

async function boot(){
  if (DEMO) {
    DB = LocalDB();
    await loadCoachData();
    setDemoRole(S.demoRole);
    return;
  }
  renderMsg("Caricamento…");
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [App, A, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
    const app = App.initializeApp(FIREBASE_CONFIG);
    const auth = A.getAuth(app);
    let db;
    try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
    catch(e) { db = F.getFirestore(app); }
    FB = {A, F, auth, db};
    DB = FirebaseDB(F, db);
    A.getRedirectResult(auth).catch(e => { S.loginErr = authMsg(e); });
    A.onAuthStateChanged(auth, onUser);
  } catch(e) {
    console.error(e);
    renderMsg("Impossibile caricare l'app. Controlla la connessione e ricarica la pagina.");
  }
}

async function onUser(u){
  if (!u) { S.user = null; return renderLogin(); }
  const email = (u.email || "").toLowerCase();
  if (!u.emailVerified) return renderVerify(u);
  // Chi è il coach lo decidono SOLO le regole di sicurezza di Firebase (l'email del coach non è scritta qui):
  // se l'utente riesce a leggere l'elenco degli atleti è il coach, altrimenti è un atleta.
  renderMsg("Caricamento…");
  try {
    await loadCoachData();
    S.user = {email, name: u.displayName || "Coach", role:"coach"};
    return render();
  } catch(e) {
    if (e?.code !== "permission-denied") { console.error(e); return renderMsg("Errore di connessione nel caricare i dati. Controlla la rete e ricarica la pagina. (" + (e?.code || e) + ")"); }
  }
  try {
    const a = await DB.getAthlete(email);
    if (!a || a.archived) return renderNotRegistered(email);
    S.user = {email, name: a.name, role:"athlete", group: a.group, mesos: a.mesos || []};
    renderMsg("Caricamento programma…");
    const [ex, st] = await Promise.all([DB.listExercises().catch(() => null), DB.getSettings().catch(() => ({})), ensureWeeks(email, addDays(S.ath.ws, -56), 11)]);
    if (ex) S.exercises = ex;
    applyParams(st?.params);
    fillDatalist();
    renderAthlete();
  } catch(e) { console.error(e); renderNotRegistered(email); }
}

async function loadCoachData(){
  let st;
  [S.athletes, S.exercises, S.templates, st] = await Promise.all([DB.listAthletes(), DB.listExercises(), DB.listTemplates(), DB.getSettings()]);
  S.params = st.params || []; applyParams(S.params); S.pdfSig = st.pdf || null;
  S.templates.sort((a,b) => (a.title||"").localeCompare(b.title||""));
  S.exercises.sort((a,b)=>a.name.localeCompare(b.name));
  if (!S.calAthlete || !athByEmail(S.calAthlete)) S.calAthlete = activeAthletes()[0]?.email || null;
  fillDatalist();
}
function fillDatalist(){ $("#exlib").innerHTML = S.exercises.map(x => `<option value="${esc(x.name)}"></option>`).join(""); }

function authMsg(e){
  const m = {"auth/invalid-credential":"Email o password non corretti.","auth/wrong-password":"Password non corretta.","auth/user-not-found":"Nessun account con questa email.",
    "auth/email-already-in-use":"Esiste già un account con questa email: usa «Accedi».","auth/weak-password":"La password deve avere almeno 6 caratteri.",
    "auth/invalid-email":"Email non valida.","auth/popup-closed-by-user":"Finestra di Google chiusa prima di completare l'accesso.",
    "auth/network-request-failed":"Nessuna connessione.","auth/too-many-requests":"Troppi tentativi, riprova tra qualche minuto.",
    "auth/unauthorized-domain":"Questo indirizzo non è autorizzato in Firebase (Authentication → Impostazioni → Domini autorizzati)."};
  return m[e?.code] || ("Errore: " + (e?.code || e?.message || e));
}

/* ---------- ANALISI ---------- */
const anQ = {gran: "week", dws: null, kv: "pesi", ks: "all", who: null, from: addDays(monday(TODAY()), -77), to: addDays(monday(TODAY()), 6), metric: "volume"};
const METRICS = {
  volume: {l:"Volume", u:"kg", d:"Somma di kg × reps delle serie registrate (solo le serie con kg e reps compilati)."},
  sets:   {l:"Serie", u:"", d:"Numero di serie registrate: spuntate o compilate, extra comprese."},
  srpe:   {l:"Carico sRPE", u:"UA", d:"RPE di sessione × durata in minuti delle sedute completate (unità arbitrarie)."},
};
const numv = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };
const fmtN = (v, dec=0) => v == null ? "–" : Number(v).toLocaleString("it-IT", {maximumFractionDigits: dec});
const compact = v => v >= 10000 ? (v/1000).toLocaleString("it-IT", {maximumFractionDigits: 1}) + "k" : fmtN(v);
function wStats(w){
  let sets = 0, vol = 0, reps = 0; const ex = {};
  (w.exercises||[]).forEach(x => { const rr = (w.results||{})[x.id] || [];
    rr.forEach(r => { if (emptyRes(r)) return; sets++; const k = numv(r.kg), rp = numv(r.reps);
      const e = (ex[exName(w, x)] ??= {sets:0, reps:0, vol:0, kgMax:null, hMax:null, tMin:null});
      const hh = numv(r.height), tt = numv(r.time);
      if (hh != null) e.hMax = Math.max(e.hMax ?? 0, hh);
      if (tt != null && tt > 0 && !x.cols.includes("reps")) e.tMin = Math.min(e.tMin ?? Infinity, tt);
      e.sets++; if (rp != null) { reps += rp; e.reps += rp; }
      if (k != null && rp != null) { vol += k*rp; e.vol += k*rp; }
      if (k != null) e.kgMax = Math.max(e.kgMax ?? 0, k); }); });
  const srpe = w.status === "done" && w.sessionRpe && w.durationMin ? w.sessionRpe * w.durationMin : 0;
  return {sets, vol, reps, srpe, ex};
}
function weeklySeries(email, from, to){
  const w0 = monday(from), n = Math.floor(daysBetween(w0, monday(to)) / 7) + 1, today = TODAY();
  return Array.from({length:n}, (_,k) => { const ws = addDays(w0, k*7), we = addDays(ws, 6);
    const a = ws < from ? from : ws, b = we > to ? to : we;
    const list = wIn(email, a, b);
    return accumLoad({ws, volume:0, sets:0, srpe:0, planned: list.length, done: 0, cut: ws < from || we > to, open: we >= today, byK: {}}, list); });
}
function accumLoad(o, list){
  const inK = (f, k) => !f || f === "all" || f === k;   // filtro "tipo di seduta" per volume e serie (anQ.kv / anQ.ks)
  list.forEach(w => { const st = wStats(w), k = kindOf(w), b = (o.byK[k] ??= {volume:0, sets:0, srpe:0, n:0});
    b.volume += st.vol; b.sets += st.sets; b.srpe += st.srpe; b.n++;
    if (inK(anQ.kv, k)) o.volume += st.vol; if (inK(anQ.ks, k)) o.sets += st.sets; o.srpe += st.srpe; if (w.status === "done") o.done++; });

function drawSessionChart(el, w){

  const padL = 30, padR = 10, padT = 26, ih = 200, padB = 58;
  const avail = Math.max(300, el.clientWidth || 700), band = Math.max(26, Math.min(56, (avail - padL - padR) / n));
  const W = padL + padR + band * n, H = padT + ih + padB;
  const y = v => padT + ih - v / 10 * ih, X = k => padL + band * k + band / 2, bw = Math.min(28, band * 0.62);   // barre: partono da 0

    svg += `<line class="sband" x1="${x1}" x2="${x2}" y1="${padT+ih+30}" y2="${padT+ih+30}"/><g class="axis"><text x="${x1}" y="${padT+ih+46}">${esc(t)}</text></g>`; });

  if (w.sessionRpe) svg += `<g class="axis"><text x="${padL+4}" y="${y(+w.sessionRpe)-6}" style="paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round">RPE seduta ${w.sessionRpe}</text></g>`;

      np.opts = isDef || !list.length || list.some(o => !o) ? (np.pick ? null : (p.opts || null)) : list; }

async function deleteParam(key){
  // resta salvato come "eliminato" (non compare più da nessuna parte) così gli allenamenti vecchi mostrano ancora il suo nome
  const list = (S.params || []).map(x => x.key === key ? {...x, deleted: true, archived: true} : x);
  await DB.saveSettings({params: list}); S.params = list; applyParams(list);
  const strip = x => { if (!(x.cols || []).includes(key)) return false; x.cols = x.cols.filter(c => c !== key); (x.sets || []).forEach(s => delete s[key]); return true; };
  for (const e of S.exercises) if (strip(e)) await DB.saveExercise(e);
  for (const t of S.templates) { let ch = false; (t.exercises || []).forEach(x => { if (strip(x)) ch = true; }); if (ch) await DB.saveTemplate(t); }
  toast("Parametro eliminato"); renderView();
}

function unlinkAround(a, i){ const x = a[i]; if (!x) return; if (x.ss) { x.ss = false; } if (a[i+1]?.ss) { a[i+1].ss = false; a[i+1].block = a[i+1].block || x.block; } }
/* sposta un esercizio di una posizione: dentro una superserie/circuito cambia solo l'ordine nel gruppo;
   dal bordo del gruppo esce e resta subito fuori; un esercizio singolo "salta" il gruppo o l'esercizio vicino intero */
function moveEx(a, i, d){
  const G = ssGroups(a).map(g => g.map(k => a[k])), x = a[i], gi = G.findIndex(g => g.includes(x)), g = G[gi], k = g.indexOf(x);
  if (g.length > 1 && g[k + d]) [g[k], g[k + d]] = [g[k + d], g[k]];
  else if (g.length > 1) { g.splice(k, 1); if (x.circ) { g[0].circ = x.circ; delete x.circ; } G.splice(d < 0 ? gi : gi + 1, 0, [x]); }   // esce dal gruppo: le impostazioni del circuito restano al gruppo
  else { const t = gi + d; if (t < 0 || t >= G.length) return; [G[gi], G[t]] = [G[t], G[gi]]; }
  const flat = [];
  G.forEach(g => { if (!g.length) return; const meta = g.find(y => y.circ)?.circ, blk = g.find(y => !y.ss)?.block ?? g[0].block;
    g.forEach((y, j) => { y.ss = j > 0; if (j > 0) delete y.circ; y.block = blk; }); if (meta) g[0].circ = meta; flat.push(...g); });
  a.splice(0, a.length, ...flat); relabel(a);
}
/* lettere dei blocchi sempre in ordine (A, B, C…) — solo se sono lettere singole; se hai scritto etichette tue non le tocco */
function relabel(a){ const G = ssGroups(a); if (!G.every(g => /^[A-Za-z]?$/.test((a[g[0]].block || "").trim()))) return;
  G.forEach((g, n) => { const b = n < 26 ? String.fromCharCode(65 + n) : "Z"; g.forEach(k => a[k].block = b); }); }

/* ---------- video dentro l'app ----------
   trasforma il link (YouTube, Shorts, Vimeo, Google Drive, Instagram, file .mp4) nell'indirizzo del lettore "incorporato";
   se il sito non si può incorporare restituisce null e il link si apre in una pagina nuova come prima */
function videoEmbed(url){
  let u; try { u = new URL(String(url||"").trim()); } catch(e) { return null; }
  const h = u.hostname.replace(/^(www|m|mobile)\./, ""), path = u.pathname;
  const secs = t => { if (!t) return 0; if (/^\d+$/.test(t)) return +t; const m = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/); return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0; };
  const yt = (id, tall) => id && {ownFs: true, src: `https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1&modestbranding=1${secs(u.searchParams.get("t") || u.searchParams.get("start")) ? "&start=" + secs(u.searchParams.get("t") || u.searchParams.get("start")) : ""}`, tall, site: "YouTube"};
  let m;
  if (h === "youtu.be") return yt(path.slice(1).split("/")[0]);
  if (h === "youtube.com" || h === "youtube-nocookie.com") {
    if (u.searchParams.get("v")) return yt(u.searchParams.get("v"));
    if ((m = path.match(/^\/(shorts|embed|live)\/([\w-]+)/))) return yt(m[2], m[1] === "shorts"); }
  if (h === "vimeo.com" && (m = path.match(/^\/(\d+)/))) return {src: `https://player.vimeo.com/video/${m[1]}`, site: "Vimeo", ownFs: true};
  if (h === "player.vimeo.com") return {src: u.href, site: "Vimeo", ownFs: true};
  if (h === "drive.google.com") { const id = (path.match(/\/file\/d\/([\w-]+)/) || [])[1] || u.searchParams.get("id");
    if (id) return {src: `https://drive.google.com/file/d/${id}/preview`, site: "Google Drive", drive: true}; }
  if (h === "instagram.com" && (m = path.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/))) return {src: `https://www.instagram.com/${m[1] === "reels" ? "reel" : m[1]}/${m[2]}/embed`, tall: true, site: "Instagram"};
  if (/\.(mp4|webm|m4v|mov)$/i.test(path)) return {src: u.href, file: true, site: "il video"};
  return null;
}

function toggleVideoFull(){

/* ---------- PROGRESSIONE: le ultime volte di questo atleta su questo esercizio (previsto accanto a eseguito) ---------- */
const fmt1 = v => fmtN(v, Number.isInteger(v) ? 0 : 1);
/* massimale stimato (Epley con le ripetizioni "in riserva"): kg × (1 + (reps + RIR) / 30); RIR = 10 − RPE se c'è l'RPE */
function e1rm(r){ const kg = numv(r.kg), reps = numv(r.reps); if (!kg || !reps || reps > 15) return null;
  const q = setRpe(r); const rir = q ? Math.max(0, 10 - q.v) : 0; return kg * (1 + (reps + rir) / 30); }
/* indicatore di progresso della seduta per quell'esercizio: massimale stimato, altezza, distanza, tempo migliore o ripetizioni totali */
function sessMetric(sets, cols){
  const done = sets.map(o => o.r); const best = (f, pick) => { const v = done.map(f).filter(x => x != null && x > 0); return v.length ? pick(...v) : null; };
  if (cols.includes("kg") && cols.includes("reps")) { const v = best(e1rm, Math.max); if (v) return {v, l: "Massimale stimato", u: "kg", up: 1}; }
  if (cols.includes("height")) { const v = best(r => numv(r.height), Math.max); if (v) return {v, l: "Altezza migliore", u: "cm", up: 1}; }
  if (cols.includes("dist")) { const v = best(r => numv(r.dist), Math.max); if (v) return {v, l: "Distanza migliore", u: "m", up: 1}; }
  if (cols.includes("vel")) { const v = best(r => numv(r.vel), Math.max); if (v) return {v, l: "Velocità migliore", u: "m/s", up: 1}; }
  if (cols.includes("time") && !cols.includes("reps")) { const v = best(r => numv(r.time), Math.min); if (v) return {v, l: "Tempo migliore", u: "s", up: -1}; }
  if (cols.includes("kg")) { const v = best(r => numv(r.kg), Math.max); if (v) return {v, l: "Kg massimi", u: "kg", up: 1}; }
  const reps = done.reduce((t, r) => t + (numv(r.reps) || 0), 0); if (reps) return {v: reps, l: "Ripetizioni totali", u: "", up: 1};
  return null;
}
function coachHistory(email, name, cur, limit = 6){

    .sort((a, b) => effDate(b).localeCompare(effDate(a)));
  for (const w of ws) { if (out.length >= limit) break;
    const x = (w.exercises || []).find(x => sameName(exName(w, x), name)) || (w.exercises || []).find(x => sameName(x.name, name)); if (!x) continue;
    const sets = (w.results[x.id] || []).map((r, j) => ({r, s: x.sets[j] || {}, extra: j >= x.sets.length})).filter(o => o.r.done || !emptyRes(o.r));

    if (sets.length) out.push({w, x, date: effDate(w), sets, m: other ? null : sessMetric(sets, x.cols || []), swapped: !!swapOf(w, x), other, sw: swapOf(w, x)}); }

}

function execSetHtml(o, cols){

function spark(vals, up){
  if (vals.length < 2) return "";
  const W = 80, H = 22, mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, k) => [2 + k * (W - 4) / (vals.length - 1), H - 3 - (v - mn) / rg * (H - 6)]);
  return `<svg class="spk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p => p.join(",")).join(" ")}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3"/></svg>`;
}
/* stesso pattern motorio: tutte le sedute con esercizi di quel pattern (o tra le alternative), misurate con lo "stimolo" */
const isHard = r => { const q = setRpe(r); return q ? q.v >= 7 : null; };   // serie allenante: RPE ≥ 7 (o RIR ≤ 3)
/* "stimolo" di un gruppo di serie eseguite: serie, allenanti, ripetizioni (o contatti), RPE medio */
function stimStats(rs){
  const known = rs.filter(r => isHard(r) != null), rp = rs.map(r => setRpe(r)?.v).filter(v => v != null);
  return {n: rs.length, hard: known.length ? known.filter(isHard).length : null, reps: rs.reduce((t, r) => t + (numv(r.reps) || 0), 0), rpe: rp.length ? rp.reduce((t, v) => t + v, 0) / rp.length : null};
}

  setTimeout(() => URL.revokeObjectURL(a.href), 10000); toast("PDF scaricato: lo trovi nei Download");
}

    if ((why === "other" || why === "pain") && !note) { $("#sw-note").focus(); return toast("Scrivi due parole al coach sul motivo"); }
    w.swaps = {...(w.swaps||{}), [x.id]: {name: pick, reason: why, note, at: new Date().toISOString()}};
    $("#modal").innerHTML = ""; { const y = scrollY; renderWorkout(); scrollTo(0, y); } await flushSave({swaps: w.swaps}); toast(`Cambiato con ${pick}`); };
}
function finishSheet(skip=false){
  const w = athleteWorkout();
  let rpe = w.sessionRpe || 0;
  $("#modal").innerHTML = `<div class="back" style="align-items:flex-end;padding:0"><form class="modal sm" id="fin" style="margin:0;border-radius:18px 18px 0 0;max-width:560px;padding-bottom:env(safe-area-inset-bottom,0px)">
    <header><h2>${skip?"Allenamento non svolto":"Com'è andata?"}</h2><button type="button" class="btn ghost icon" data-act="modal-close" aria-label="Chiudi">✕</button></header>
    <div class="body">${skip ? "" : `
      <div class="field"><span class="lbl">Fatica della seduta (RPE 1–10)</span><div class="rpe">${Array.from({length:10},(_,i)=>i+1).map(v=>`<button type="button" class="${rpe===v?"on":""}" data-rpe="${v}"><b>${v}</b><small>${RPE_LABELS[v]||"&nbsp;"}</small></button>`).join("")}</div></div>
      <div class="field"><label class="lbl" for="f-dur">Durata (minuti)</label><input class="in" id="f-dur" inputmode="numeric" value="${w.durationMin||""}" placeholder="es. 75" style="font-size:17px"></div>
      ${(() => { const def = w.doneDate || (w.date > TODAY() ? TODAY() : w.date);
        const other = def !== TODAY() && def !== w.date;
        const opt = (key, title, sub, on) => `<button type="button" class="wopt ${on ? "on" : ""}" data-w="${key}" role="radio" aria-checked="${on}"><i></i><span><b>${title}</b>${sub ? `<small>${sub}</small>` : ""}</span></button>`;
        return `<div class="field"><span class="lbl">Quando l'hai svolto?</span><div class="wopts" id="f-when" role="radiogroup" aria-label="Quando l'hai svolto">
          ${opt("today", "Oggi", esc(fmtLong(TODAY())) + (w.date === TODAY() ? " · il giorno previsto" : ""), def === TODAY())}
          ${w.date <= TODAY() && w.date !== TODAY() ? opt("plan", "Il giorno previsto", esc(fmtLong(w.date)), def === w.date) : ""}
          ${opt("other", "Un altro giorno", "", other)}</div>
          <input class="in" type="date" id="f-date" value="${def}" max="${TODAY()}" ${other ? "" : "hidden"} style="margin-top:8px;max-width:220px" aria-label="Data in cui l'hai svolto">
          ${w.date > TODAY() ? `<span class="faint" style="font-size:12px;margin-top:4px">Era previsto ${esc(fmtLong(w.date))}: se lo fai oggi, si sposta a oggi.</span>` : ""}</div>`; })()}`}
      <div class="field"><label class="lbl" for="f-note">${skip?"Motivo (facoltativo)":"Nota per il coach (facoltativa)"}</label><textarea class="in" id="f-note" placeholder="${skip?"es. malato, esame, partita…":"Sensazioni, dolori, cosa è andato bene…"}">${esc(w.athleteNote||"")}</textarea></div>
    </div><footer><button class="btn pri grow" style="justify-content:center;padding:12px">${skip?"Segna come non svolto":"Salva e completa"}</button></footer></form></div>`;
  const f = $("#fin");
  f.querySelectorAll("[data-rpe]").forEach(b => b.onclick = () => { rpe = +b.dataset.rpe; f.querySelectorAll("[data-rpe]").forEach(x => x.classList.toggle("on", +x.dataset.rpe === rpe)); });
  f.querySelectorAll("#f-when [data-w]").forEach(b => b.onclick = () => {
    const k = b.dataset.w, d = $("#f-date");
    f.querySelectorAll("#f-when [data-w]").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    d.hidden = k !== "other";
    if (k === "today") d.value = TODAY(); else if (k === "plan") d.value = w.date;
    else { if (d.value === TODAY() || d.value === w.date) d.value = addDays(TODAY(), -1); d.focus(); } });
  f.onsubmit = async ev => { ev.preventDefault();
    const note = $("#f-note").value.trim();
    if (skip) { w.status = "skipped"; await flushSave({athleteNote: note, completedAt: new Date().toISOString()}); }
    else {
      if (!rpe) return toast("Scegli un valore di RPE");
      const dur = parseInt($("#f-dur").value, 10) || null;
      const when = $("#f-date")?.value; const doneDate = when && when !== w.date ? when : null;
      w.status = "done"; w.doneDate = doneDate;
      await flushSave({sessionRpe: rpe, durationMin: dur, athleteNote: note, completedAt: new Date().toISOString(), doneDate});
      if (doneDate) { S.ath.day = doneDate; S.ath.ws = monday(doneDate); }
    }
    $("#modal").innerHTML = ""; toast(skip ? "Segnato come non svolto" : "Allenamento completato"); S.ath.open = null; renderAthlete(); };
}

/* ---------- tablet/telefono: i "passa sopra" (title) non esistono → un tocco su un elemento con data-tip mostra il fumetto ---------- */
let tipPT = "mouse";

function hideTapTip(){ $("#taptip")?.remove(); }
document.addEventListener("click", e => {
  const t = e.target.closest?.("[data-tip]");
  if (!t || tipPT === "mouse" || !t.dataset.tip) { hideTapTip(); return; }
  const same = $("#taptip")?.dataset.for === t.dataset.tip + "|" + t.getBoundingClientRect().top; hideTapTip(); if (same) return;   // secondo tocco sullo stesso: chiude
  const b = document.createElement("div"); b.id = "taptip"; b.className = "taptip"; b.textContent = t.dataset.tip; b.dataset.for = t.dataset.tip + "|" + t.getBoundingClientRect().top;
  document.body.appendChild(b);
  const r = t.getBoundingClientRect(), w = b.offsetWidth, h = b.offsetHeight;
  let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(x, innerWidth - w - 8));
  let y = r.top - h - 6; if (y < 8) y = r.bottom + 6;
  b.style.left = x + "px"; b.style.top = y + "px";
});

/* drag & drop nel calendario */
/* trascinando uno degli allenamenti selezionati si spostano (o con Ctrl si copiano) tutti, mantenendo la distanza tra i giorni */
const copyKey = e => e.ctrlKey || e.metaKey || e.altKey;
document.addEventListener("dragstart", e => { const c = e.target.closest?.("[data-drag]"); if (!c) return; const id = c.dataset.drag;
  const ids = S.calSel.has(id) ? [...S.calSel] : [id];
  e.dataTransfer.setData("text/plain", JSON.stringify({from: id, ids})); e.dataTransfer.effectAllowed = "copyMove";
  setTimeout(() => ids.forEach(k => document.querySelector(`.wcard[data-id="${k}"]`)?.classList.add("dragging")), 0); });
document.addEventListener("dragover", e => { const c = e.target.closest?.("[data-drop]"); if (!c) return; e.preventDefault();
  e.dataTransfer.dropEffect = copyKey(e) ? "copy" : "move";
  document.querySelectorAll(".cell.drop").forEach(x => x !== c && x.classList.remove("drop", "cp")); c.classList.add("drop"); c.classList.toggle("cp", copyKey(e));
  const at = dropIndex(c, e.clientY); document.querySelectorAll(".wcard.insb, .cell.inse").forEach(x => x.classList.remove("insb", "inse"));   // dove finirà: linea sopra la scheda (o in fondo al giorno)
  if (at.before) at.before.classList.add("insb"); else c.classList.add("inse"); });
/* posizione nel giorno in base all'altezza del mouse: prima della prima scheda che ha il centro più in basso */
function dropIndex(c, y){ const cards = [...c.querySelectorAll(".wcard")].filter(el => !el.classList.contains("dragging"));
  const before = cards.find(el => { const r = el.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
  return {before, ids: cards.map(el => el.dataset.id)}; }
document.addEventListener("dragend", () => document.querySelectorAll(".wcard.insb, .cell.inse, .wcard.dragging").forEach(x => x.classList.remove("insb", "inse", "dragging")));
document.addEventListener("dragleave", e => { const c = e.target.closest?.("[data-drop]"); if (c && !c.contains(e.relatedTarget)) { c.classList.remove("drop", "inse"); c.querySelectorAll(".insb").forEach(x => x.classList.remove("insb")); } });
document.addEventListener("drop", async e => { const c = e.target.closest?.("[data-drop]"); if (!c) return; e.preventDefault(); c.classList.remove("drop", "cp");
  const at = dropIndex(c, e.clientY); document.querySelectorAll(".wcard.insb, .cell.inse, .wcard.dragging").forEach(x => x.classList.remove("insb", "inse", "dragging"));
  let data; try { data = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(err) { data = {from: e.dataTransfer.getData("text/plain")}; }
  const em = S.calAthlete, anchor = S.cache[em]?.[data.from]; if (!anchor) return;
  const list = (data.ids || [data.from]).map(id => S.cache[em]?.[id]).filter(Boolean);
  const delta = daysBetween(effDate(anchor), c.dataset.drop), copy = copyKey(e);
  /* ordine nel giorno di arrivo: gli allenamenti trascinati si inseriscono dove c'è la linea; gli altri del giorno scalano */
  const placeInDay = async (moved) => { const day = c.dataset.drop, ids = moved.map(w => w.id);
    const rest = wOn(em, day).filter(w => !ids.includes(w.id)), pos = at.before ? rest.findIndex(w => w.id === at.before.dataset.id) : rest.length;
    const seq = [...rest]; seq.splice(pos < 0 ? rest.length : pos, 0, ...moved.filter(w => effDate(w) === day));
    const changed = []; seq.forEach((w, k) => { if (w.order !== k) { w.order = k; changed.push(w); } }); return changed; };
  if (copy) {
    const made = []; for (const w of list) { const nw = freshCopy(w, addDays(effDate(w), delta)); await DB.createWorkout(em, nw); (S.cache[em] ??= {})[nw.id] = nw; made.push(nw); }
    const ch = await placeInDay(made); for (const w of ch) await DB.saveWorkout(em, w);
    S.calSel = new Set(made.length > 1 ? made.map(w => w.id) : []); drawCalendar();
    toast(list.length === 1 ? `Copiato a ${fmtLong(addDays(effDate(anchor), delta))}` : `${list.length} allenamenti copiati`); return; }
  if (!delta) {   // stesso giorno: cambia solo l'ordine
    const ch = await placeInDay(list.filter(w => effDate(w) === c.dataset.drop)); if (!ch.length) return;
    drawCalendar(); for (const w of ch) await DB.saveWorkout(em, w); toast("Ordine del giorno aggiornato"); return; }
  list.forEach(w => { w.date = addDays(effDate(w), delta); w.doneDate = null; w.updatedAt = new Date().toISOString(); });
  const ch = await placeInDay(list); const toSave = [...new Set([...list, ...ch])];
  drawCalendar(); for (const w of toSave) await DB.saveWorkout(em, w);
  toast(list.length === 1 ? `Spostato a ${fmtLong(anchor.date)}` : `${list.length} allenamenti spostati`); });
/* selezione a riquadro: tieni premuto il tasto sinistro su uno spazio vuoto del calendario e trascina */
document.addEventListener("mousedown", e => {
  const wrap = e.target.closest?.("#calwrap"); if (!wrap || e.button !== 0 || e.target.closest(".wcard, button, a, input, select, .mband")) return;
  const x0 = e.clientX, y0 = e.clientY, keep = copyKey(e) ? new Set(S.calSel) : new Set(); let box = null, moved = false;
  const cards = [...wrap.querySelectorAll(".wcard")].map(el => ({el, id: el.dataset.id}));
  const move = ev => { if (!moved && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return; moved = true; ev.preventDefault();
    if (!box) { box = document.createElement("div"); box.className = "lasso"; document.body.appendChild(box); document.body.classList.add("nosel"); }
    const l = Math.min(x0, ev.clientX), t = Math.min(y0, ev.clientY), r = Math.max(x0, ev.clientX), b = Math.max(y0, ev.clientY);
    Object.assign(box.style, {left: l + "px", top: t + "px", width: (r - l) + "px", height: (b - t) + "px"});
    cards.forEach(c => { const q = c.el.getBoundingClientRect(); const hit = q.left < r && q.right > l && q.top < b && q.bottom > t; c.el.classList.toggle("sel", hit || keep.has(c.id)); }); };
  const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); box?.remove(); document.body.classList.remove("nosel");
    if (moved) { S.calSel = new Set([...keep, ...cards.filter(c => c.el.classList.contains("sel")).map(c => c.id)]); drawCalendar(); }
    else if (S.calSel.size) { S.calSel.clear(); drawCalendar(); } };
  window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
});
/* ---------- aggiornamento dati: tira giù, pulsante, ritorno nell'app ---------- */
let refreshing = false, lastRefresh = Date.now();
async function refreshData(silent=false){
  if (refreshing || !S.user) return; refreshing = true; S.slow = false;
  const ptr = $("#ptr"); ptr.classList.add("spin"); ptr.querySelector("span").textContent = "Aggiornamento…"; ptr.style.transform = "translate(-50%,0)";
  try {
    if (saveT) await flushSave();
    S.loaded = {};
    if (S.user.role === "coach") {
      await loadCoachData();
      if (S.editor && !S.editor.dirty && !S.editor.tpl && !S.editor.isNew) { await ensureWeeks(S.editor.email, monday(S.editor.w.date), 1); const fresh = S.cache[S.editor.email]?.[S.editor.w.id]; if (fresh) { S.editor.w = clone(fresh); drawEditor(); } }
      await renderView();
    } else {
      const [a, ex, st] = await Promise.all([DB.getAthlete(S.user.email), DB.listExercises().catch(() => null), DB.getSettings().catch(() => null),
        ensureWeeks(S.user.email, addDays(S.ath.ws, -56), 11)]);     // in parallelo: con rete lenta si aspetta una volta sola
      if (st) applyParams(st.params);
      if (a) { S.user.name = a.name; S.user.mesos = a.mesos || []; }
      if (ex) S.exercises = ex;
      const y = scrollY; renderAthlete(); scrollTo(0, y);
    }
    lastRefresh = Date.now();
    if (S.slow) toast("Connessione lenta: vedi i dati salvati sul telefono. Riprova tra poco."); else if (!silent) toast("Aggiornato");
  } catch(e) { console.error(e); if (!silent) toast("Aggiornamento non riuscito: controlla la connessione"); }
  finally { refreshing = false; ptr.classList.remove("spin", "ready"); ptr.style.transform = ""; ptr.querySelector("span").textContent = "Tira giù per aggiornare"; }
}
// tira giù dall'inizio della pagina (telefono)
let ptrY = null, ptrReady = false;
const busy = () => $("#modal").innerHTML || $("#confirm").innerHTML || refreshing;
document.addEventListener("touchstart", e => { ptrY = (scrollY <= 0 && !busy() && e.touches.length === 1) ? e.touches[0].clientY : null; ptrReady = false; }, {passive: true});
document.addEventListener("touchmove", e => {
  if (ptrY == null) return; const dy = e.touches[0].clientY - ptrY;
  if (dy <= 0 || scrollY > 0) { $("#ptr").style.transform = ""; ptrReady = false; return; }
  const p = $("#ptr"); p.style.transform = `translate(-50%,${Math.min(dy/2, 60) - 70}px)`;
  ptrReady = dy > 110; p.classList.toggle("ready", ptrReady); p.querySelector("span").textContent = ptrReady ? "Rilascia per aggiornare" : "Tira giù per aggiornare";
}, {passive: true});
document.addEventListener("touchend", () => { if (ptrY == null) return; ptrY = null;
  if (ptrReady && Date.now() - lastRefresh > 2500) refreshData(); else if (ptrReady) toast("Già aggiornato");
  $("#ptr").style.transform = refreshing ? "translate(-50%,0)" : ""; ptrReady = false; });
// quando si torna nell'app (o nella scheda) dopo almeno 30 secondi, i dati si aggiornano da soli
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !S.user || busy()) return;
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!typing && Date.now() - lastRefresh > 30000) refreshData(true);
});

window.addEventListener("beforeunload", e => { if (saveT) { flushSave(); } if (S.editor?.dirty) { e.preventDefault(); e.returnValue = ""; } });

boot();
</script>
