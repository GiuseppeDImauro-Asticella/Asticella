    if (E.dirty) { if (!(await confirmBox("Salvo prima le modifiche?", "Salva e continua", false))) return; const keep = {email:E.email, id:E.w.id}; await saveEditor(); openEditor(keep.email, S.cache[keep.email][keep.id]); }
    const w = S.editor.w;
    copyDialog({title:`Copia «${w.title}»`, date: addDays(w.date, 7), dateLabel:"Nella data", preselect:[S.editor.email],
      onCopy: async (d, emails) => { const n = await copyWorkouts([w], w.date, d, emails); closeEditor(true); return n; }}); },
  "ed-add-ex"(){ const w = S.editor.w; const x = newExercise(); x.block = nextBlock(w.exercises); w.exercises.push(x); markDirty(); drawEditor();
    const ins = document.querySelectorAll(".ex .nm"); ins[ins.length-1]?.focus(); },
  "ex-up"(t){ const a = S.editor.w.exercises, i = +t.dataset.i; unlinkAround(a, i); unlinkAround(a, i-1); [a[i-1], a[i]] = [a[i], a[i-1]]; markDirty(); drawEditor(); },
  "ex-down"(t){ const a = S.editor.w.exercises, i = +t.dataset.i; unlinkAround(a, i); unlinkAround(a, i+1); [a[i+1], a[i]] = [a[i], a[i+1]]; markDirty(); drawEditor(); },
  "ex-rm"(t){ const a = S.editor.w.exercises, i = +t.dataset.i; if (a[i+1]?.ss && !a[i].ss) { a[i+1].ss = false; a[i+1].block = a[i].block; } a.splice(i, 1); markDirty(); drawEditor(); },
  "ex-ss"(t){ const a = S.editor.w.exercises, i = +t.dataset.i; const x = a[i];
    if (x.ss) { x.ss = false; x.block = nextBlock(a, i); }
    else { x.ss = true; let k = i-1; while (k > 0 && a[k].ss) k--; x.block = a[k].block || "A"; }
    markDirty(); drawEditor(); },
  "col-mv"(t){ const x = S.editor.w.exercises[+t.dataset.i]; const k = +t.dataset.k, d = +t.dataset.d; const c = x.cols; if (!c[k+d]) return; [c[k], c[k+d]] = [c[k+d], c[k]]; markDirty(); drawEditor(); },
  async "ex-tolib"(t){ const x = S.editor.w.exercises[+t.dataset.i]; const nx = {id: uid(), name: x.name.trim(), category:"", pattern:"", cols:[...x.cols], video:"", notes:""};
    await DB.saveExercise(nx); S.exercises.push(nx); S.exercises.sort((a,b)=>a.name.localeCompare(b.name)); fillDatalist(); toast("Aggiunto alla libreria"); drawEditor(); },
  "col-rm"(t){ const x = S.editor.w.exercises[+t.dataset.i]; const c = t.dataset.c; x.cols = x.cols.filter(k => k !== c); x.sets.forEach(s => delete s[c]); markDirty(); drawEditor(); },
  "set-dup"(t){ const x = S.editor.w.exercises[+t.dataset.i]; const j = +t.dataset.j; x.sets.splice(j+1, 0, clone(x.sets[j])); markDirty(); drawEditor(); },
  "set-rm"(t){ const x = S.editor.w.exercises[+t.dataset.i]; if (x.sets.length > 1) x.sets.splice(+t.dataset.j, 1); markDirty(); drawEditor(); },
  "set-type"(t){ const s = S.editor.w.exercises[+t.dataset.i].sets[+t.dataset.j]; const k = TYPE_ORDER[(TYPE_ORDER.indexOf(s.type||"")+1) % TYPE_ORDER.length];
    if (k) s.type = k; else delete s.type; markDirty(); drawEditor(); },
  "set-plus"(t){ const x = S.editor.w.exercises[+t.dataset.i]; x.sets.push(clone(x.sets[x.sets.length-1] || {})); markDirty(); drawEditor(); },
  "set-minus"(t){ const x = S.editor.w.exercises[+t.dataset.i]; if (x.sets.length > 1) x.sets.pop(); markDirty(); drawEditor(); },
  /* atleti */
  "ath-new"(){ S.athEdit = {isNew:true}; renderView(); setTimeout(()=>$("#a-name")?.focus(), 20); },
  "ath-edit"(t){ S.athEdit = {...athByEmail(t.dataset.e)}; renderView(); },
  "ath-cancel"(){ S.athEdit = null; renderView(); },
  async "copy-url"(){ const u = $("#app-url").textContent; try { await navigator.clipboard.writeText(u); toast("Link copiato"); } catch(e){ const r = document.createRange(); r.selectNodeContents($("#app-url")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selezionato: premi Ctrl+C"); } },
  /* esercizi */
  async "ex-base"(){
    const have = new Set(S.exercises.map(x => x.name.trim().toLowerCase()));
    const todo = BASE_EXERCISES.filter(([n]) => !have.has(n.toLowerCase()));
    if (!todo.length) return toast("Hai già tutti gli esercizi di base");
    if (!(await confirmBox(`Aggiungo ${todo.length} esercizi di base (squat, stacchi, pliometria, sprint, salto…). Quelli che hai già non vengono toccati.`, "Aggiungi", false))) return;
    for (const [name, category, pattern, cols] of todo) { const x = {id: uid(), name, category, pattern, cols, video:"", notes:""}; await DB.saveExercise(x); S.exercises.push(x); }
    S.exercises.sort((a,b) => a.name.localeCompare(b.name)); fillDatalist(); toast(`${todo.length} esercizi aggiunti`); renderView(); },
  "param-new"(){ paramDialog(null); },
  "param-edit"(t){ const p = (S.params||[]).find(x => x.key === t.dataset.k); if (p) paramDialog(clone(p)); },
  "ex-new"(){ S.exEdit = {isNew:true, cols:["reps","kg"]}; renderView(); setTimeout(()=>$("#x-name")?.focus(), 20); },
  "ex-edit"(t){ S.exEdit = clone(S.exercises.find(x => x.id === t.dataset.id)); renderView(); },
  "ex-cancel"(){ S.exEdit = null; renderView(); },
  "xalt-rm"(t){ const e = keepExForm(); e.alts = (e.alts||[]).filter((_,k) => k !== +t.dataset.k); renderView(); },
  /* alternative nell'editor allenamento: toccarle le rende "di questo allenamento" (la libreria non cambia) */
  "alt-rm"(t){ const x = S.editor.w.exercises[+t.dataset.i]; x.alts = altsOf(x).filter((_,k) => k !== +t.dataset.k); markDirty(); drawEditor(); },
  "alt-reset"(t){ const x = S.editor.w.exercises[+t.dataset.i]; delete x.alts; markDirty(); drawEditor(); },
  async "swap-undo"(t){ const x = S.editor.w.exercises[+t.dataset.i]; const sw = {...(S.editor.w.swaps||{})}; delete sw[x.id]; await saveCoachFix({swaps: sw}); },
  /* atleta */
  "a-swap"(t){ swapSheet(t.dataset.x); },
  video(t){ openVideo(t.dataset.u, t.dataset.t); },
  "video-full"(){ toggleVideoFull(); },
  "video-close"(t, e){ if (e && t.classList.contains("vback") && e.target !== t) return; closeVideo(); },
  "x-video-try"(){ const u = $("#x-video").value.trim(); if (!u) return toast("Incolla prima il link del video");
    if (!videoEmbed(u)) return toast("Questo link non si può aprire dentro l'app: all'atleta si aprirà in una pagina nuova"); openVideo(u, $("#x-name").value.trim()); },
  async "a-unswap"(t){ const w = athleteWorkout(); if (!w) return; const sw = {...(w.swaps||{})}; delete sw[t.dataset.x]; w.swaps = sw;
    { const y = scrollY; renderWorkout(); scrollTo(0, y); } await flushSave({swaps: sw}); toast("Torni all'esercizio del coach"); },
  "ex-col"(t){ const e = keepExForm(); const c = t.dataset.c;
    e.cols = e.cols.includes(c) ? e.cols.filter(k => k !== c) : [...e.cols, c]; renderView(); },
  async "ex-del"(){ const e = S.exEdit; if (!(await confirmBox(`Eliminare «${e.name}» dalla libreria? Gli allenamenti già scritti non cambiano.`, "Elimina"))) return;
    await DB.deleteExercise(e.id); S.exercises = S.exercises.filter(x => x.id !== e.id); fillDatalist(); S.exEdit = null; renderView(); },
  /* dati */
  async "d-copy"(){ const {head, rows} = await collectRows(); const tsv = [head, ...rows].map(r => r.map(v => itNum(v).replace(/[\t\n]/g," ")).join("\t")).join("\n");
    try { await navigator.clipboard.writeText(tsv); toast(`${rows.length} righe copiate: incollale in Google Fogli`); } catch(e){ toast("Il browser non permette di copiare: usa «Scarica CSV»"); } },
  async "d-csv"(){ const {head, rows} = await collectRows(); const q = v => { const s = itNum(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
    const csv = "﻿" + [head, ...rows].map(r => r.map(q).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = `asticella_${dataQ.from}_${dataQ.to}.csv`; a.click(); },
  /* atleta */
  "a-week"(t){ S.ath.ws = addDays(S.ath.ws, +t.dataset.d); S.ath.day = S.ath.ws <= TODAY() && TODAY() <= addDays(S.ath.ws,6) ? TODAY() : S.ath.ws;
    ensureWeeks(S.user.email, S.ath.ws, 1).then(renderAthlete); },
  "a-day"(t){ S.ath.day = t.dataset.d; S.ath.ws = monday(t.dataset.d); ensureWeeks(S.user.email, S.ath.ws, 1).then(renderAthlete); },
  "a-open"(t){ S.ath.open = t.dataset.id; saveState = ""; renderAthlete(); scrollTo(0,0); },
  async "a-back"(){ if (saveT) await flushSave(); S.ath.open = null; renderAthlete(); },
  "a-check"(t){ const w = athleteWorkout(); const x = w.exercises.find(x => x.id === t.dataset.x); const j = +t.dataset.j;
    w.results ??= {}; const r = (w.results[x.id] ??= []); while (r.length <= j) r.push({});
    const row = r[j]; row.done = !row.done;
    if (row.done) x.cols.filter(c => COLS[c].log).forEach(c => { if (!row[c] && x.sets[j]?.[c] && !/[-–/]/.test(x.sets[j][c])) row[c] = x.sets[j][c]; });
    scheduleSave(); const y = scrollY; renderWorkout(); scrollTo(0, y); },
  "a-side"(t){ const w = athleteWorkout(); w.results ??= {}; const r = (w.results[t.dataset.x] ??= []); const j = +t.dataset.j;
    while (r.length <= j) r.push({}); const cur = new Set((r[j].side || "").split("+").filter(Boolean)); const v = t.dataset.v;
    cur.has(v) ? cur.delete(v) : cur.add(v); r[j].side = ["Dx","Sx"].filter(k => cur.has(k)).join("+");
    scheduleSave(); const y = scrollY; renderWorkout(); scrollTo(0, y); },
  "a-rmset"(t){ const w = athleteWorkout(); const r = w.results?.[t.dataset.x]; if (!r) return; r.splice(+t.dataset.j, 1);
    scheduleSave(); const y = scrollY; renderWorkout(); scrollTo(0, y); toast("Serie extra tolta"); },
  "a-addset"(t){ const w = athleteWorkout(); w.results ??= {}; const x = w.exercises.find(x => x.id === t.dataset.x); const r = (w.results[x.id] ??= []);
    while (r.length < x.sets.length) r.push({}); r.push({}); const y = scrollY; renderWorkout(); scrollTo(0, y); },
  "a-finish"(){ if (saveT) flushSave(); finishSheet(false); },
  "a-skip"(){ finishSheet(true); },
  "modal-close"(){ $("#modal").innerHTML = ""; },
};

/* ---------- eventi delegati ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.tagName === "BUTTON" && t.closest("form")) e.preventDefault();
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#vid").innerHTML) { closeVideo(); return; }
  if (e.key === "Enter" && e.target.matches(".wcard")) ACT["open-w"](e.target, e);
  if (S.editor && e.key === "Escape" && !$("#confirm").innerHTML) closeEditor();
  if (S.editor && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveEditor(); }
});
document.addEventListener("input", e => {
  if (e.target.tagName === "SELECT" && e.target.dataset.bind && S.editor) { setPath(S.editor.w, e.target.dataset.bind, e.target.value); markDirty(); return; }
  const t = e.target;
  if (t.dataset.bind && S.editor) { let v = t.value; if (/^exercises\.\d+\.block$/.test(t.dataset.bind) && S.editor.w.exercises[+t.dataset.bind.split(".")[1]+1]?.ss) v = v.replace(/\d+$/, ""); setPath(S.editor.w, t.dataset.bind, v); markDirty(); return; }
  if (t.dataset.r) { const [xid, j, c] = t.dataset.r.split("|"); const w = athleteWorkout(); w.results ??= {}; const r = (w.results[xid] ??= []);
    while (r.length <= +j) r.push({}); r[+j][c] = COLS[c].txt ? t.value : t.value.replace(",", "."); scheduleSave(); return; }
  if (t.dataset.input === "tpl-q") { S.tplQuery = t.value; const pos = t.selectionStart; renderView(); const q = $("#tpl-q"); q.focus(); q.setSelectionRange(pos,pos); return; }
  if (t.dataset.input === "ex-q") { S.exQuery = t.value; const pos = t.selectionStart; renderView(); const q = $("#ex-q"); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener("change", async e => {
  const t = e.target, k = t.dataset.change; if (!k) return;
  if (k === "demo-role") return setDemoRole(t.value);
  if (k === "ed-from") { const tp = S.templates.find(x => x.id === t.value); if (!tp || !S.editor) return; const c = freshCopy(tp, "");
    const w = S.editor.w; w.title = tp.title; w.notes = tp.notes || ""; w.exercises = c.exercises; markDirty(); drawEditor(); toast(`Caricato «${tp.title}»`); return; }
  if (k === "a-noacc") { $("#a-email-f").hidden = t.checked; return; }
  if (k === "x-opt") { const inp = $(`#x-${t.dataset.k}-new`); inp.hidden = t.value !== "__new"; if (!inp.hidden) inp.focus(); return; }
  if (k === "an-date") { let f = $("#an-from").value || anQ.from, to = $("#an-to").value || anQ.to; if (f > to) [f, to] = [to, f];
    if (daysBetween(f, to) > 7*104) { toast("Periodo massimo: 2 anni"); f = addDays(to, -7*104); } anQ.from = f; anQ.to = to; return renderView(); }
  if (k === "an-who") { anQ.who = t.value; return renderView(); }
  if (k === "cal-ath") { S.calAthlete = t.value; return renderView(); }
  if (k === "d-q") { dataQ.from = $("#d-from").value || dataQ.from; dataQ.to = $("#d-to").value || dataQ.to; dataQ.who = $("#d-who").value; return renderView(); }
  if (k === "col-add") { const x = S.editor.w.exercises[+t.dataset.i]; const c = t.value; if (!c) return;
    if (c === "__new") { t.value = ""; return paramDialog(null, key => { x.cols = [...x.cols, key]; x.sets.forEach(s => s[key] = s[key] || ""); markDirty(); drawEditor(); }); }
    x.cols = [...x.cols, c]; x.sets.forEach(s => s[c] = s[c] || ""); markDirty(); return drawEditor(); }
  if (k === "alt-add" || k === "xalt-add") { const n = t.value.trim(); t.value = ""; if (!n) return;
    const hit = libByName(n); const name = hit ? hit.name : n;
    if (k === "xalt-add") { const e = keepExForm(); if (sameName(name, e.name)) return toast("È lo stesso esercizio");
      if (!(e.alts||[]).some(a => sameName(a, name))) e.alts = [...(e.alts||[]), name]; renderView(); return setTimeout(() => $("#x-alt")?.focus(), 20); }
    const x = S.editor.w.exercises[+t.dataset.i]; if (sameName(name, x.name)) return toast("È lo stesso esercizio");
    const cur = altsOf(x); if (!cur.some(a => sameName(a, name))) x.alts = [...cur, name];
    markDirty(); return setTimeout(() => { if (S.editor) drawEditor(); }, 0); }
  if (k === "ex-name") { const x = S.editor.w.exercises[+t.dataset.i]; const lib = libByName(t.value); delete x.alts;
    const blank = x.sets.every(s => Object.values(s).every(v => !v));
    if (lib && blank && lib.cols?.length) { x.cols = [...lib.cols]; x.sets = x.sets.map(() => Object.fromEntries(lib.cols.map(c => [c, ""]))); }
    setTimeout(() => { if (S.editor) { const f = document.activeElement?.dataset?.bind; drawEditor(); if (f) document.querySelector(`[data-bind="${f}"]`)?.focus(); } }, 0); }
});
/* drag & drop nel calendario */
document.addEventListener("dragstart", e => { const c = e.target.closest?.("[data-drag]"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.drag); e.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", e => { const c = e.target.closest?.("[data-drop]"); if (!c) return; e.preventDefault(); document.querySelectorAll(".cell.drop").forEach(x => x !== c && x.classList.remove("drop")); c.classList.add("drop"); });
document.addEventListener("dragleave", e => { const c = e.target.closest?.("[data-drop]"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("drop"); });
document.addEventListener("drop", async e => { const c = e.target.closest?.("[data-drop]"); if (!c) return; e.preventDefault(); c.classList.remove("drop");
  const id = e.dataTransfer.getData("text/plain"); const em = S.calAthlete; const w = S.cache[em]?.[id]; if (!w || effDate(w) === c.dataset.drop) return;
  w.date = c.dataset.drop; w.doneDate = null; w.updatedAt = new Date().toISOString(); drawCalendar(); await DB.saveWorkout(em, w); toast(`Spostato a ${fmtLong(w.date)}`); });
/* ---------- aggiornamento dati: tira giù, pulsante, ritorno nell'app ---------- */
let refreshing = false, lastRefresh = Date.now();
async function refreshData(silent=false){
  if (refreshing || !S.user) return; refreshing = true; S.slow = false;
  const ptr = $("#ptr"); ptr.classList.add("spin"); ptr.querySelector("span").textContent = "Aggiornamento…"; ptr.style.transform = "translate(-50%,0)";
  try {
    if (saveT) await flushSave();
    S.loaded = {};
    if (S.user.role === "coach") {
      await loadCoachData();
      if (S.editor && !S.editor.dirty && !S.editor.tpl && !S.editor.isNew) { await ensureWeeks(S.editor.email, monday(S.editor.w.date), 1); const fresh = S.cache[S.editor.email]?.[S.editor.w.id]; if (fresh) { S.editor.w = clone(fresh); drawEditor(); } }
      await renderView();
    } else {
      const [a, ex, st] = await Promise.all([DB.getAthlete(S.user.email), DB.listExercises().catch(() => null), DB.getSettings().catch(() => null),
        ensureWeeks(S.user.email, addDays(S.ath.ws, -56), 11)]);     // in parallelo: con rete lenta si aspetta una volta sola
      if (st) applyParams(st.params);
      if (a) { S.user.name = a.name; S.user.mesos = a.mesos || []; }
      if (ex) S.exercises = ex;
      const y = scrollY; renderAthlete(); scrollTo(0, y);
    }
    lastRefresh = Date.now();
    if (S.slow) toast("Connessione lenta: vedi i dati salvati sul telefono. Riprova tra poco."); else if (!silent) toast("Aggiornato");
  } catch(e) { console.error(e); if (!silent) toast("Aggiornamento non riuscito: controlla la connessione"); }
  finally { refreshing = false; ptr.classList.remove("spin", "ready"); ptr.style.transform = ""; ptr.querySelector("span").textContent = "Tira giù per aggiornare"; }
}
// tira giù dall'inizio della pagina (telefono)
let ptrY = null, ptrReady = false;
const busy = () => $("#modal").innerHTML || $("#confirm").innerHTML || refreshing;
document.addEventListener("touchstart", e => { ptrY = (scrollY <= 0 && !busy() && e.touches.length === 1) ? e.touches[0].clientY : null; ptrReady = false; }, {passive: true});
document.addEventListener("touchmove", e => {
  if (ptrY == null) return; const dy = e.touches[0].clientY - ptrY;
  if (dy <= 0 || scrollY > 0) { $("#ptr").style.transform = ""; ptrReady = false; return; }
  const p = $("#ptr"); p.style.transform = `translate(-50%,${Math.min(dy/2, 60) - 70}px)`;
  ptrReady = dy > 110; p.classList.toggle("ready", ptrReady); p.querySelector("span").textContent = ptrReady ? "Rilascia per aggiornare" : "Tira giù per aggiornare";
}, {passive: true});
document.addEventListener("touchend", () => { if (ptrY == null) return; ptrY = null;
  if (ptrReady && Date.now() - lastRefresh > 2500) refreshData(); else if (ptrReady) toast("Già aggiornato");
  $("#ptr").style.transform = refreshing ? "translate(-50%,0)" : ""; ptrReady = false; });
// quando si torna nell'app (o nella scheda) dopo almeno 30 secondi, i dati si aggiornano da soli
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !S.user || busy()) return;
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!typing && Date.now() - lastRefresh > 30000) refreshData(true);
});

window.addEventListener("beforeunload", e => { if (saveT) { flushSave(); } if (S.editor?.dirty) { e.preventDefault(); e.returnValue = ""; } });

boot();
</script>
